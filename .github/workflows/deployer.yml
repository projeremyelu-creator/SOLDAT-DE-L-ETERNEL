name: Déployer sur Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts
      - name: Installer ImageMagick pour les ressources Web
        run: |
          # Éviter la dépendance APT si FFmpeg ou ImageMagick est déjà présent.
          # Le build utilise un fallback WebP natif FFmpeg et préserve les sources.
          if command -v convert >/dev/null 2>&1; then
            convert -version | head -1
          elif command -v magick >/dev/null 2>&1; then
            magick -version | head -1
          elif command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome disponible pour l'encodeur WebP local."
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "::error::Aucun encodeur WebP (ImageMagick/FFmpeg/Chrome) disponible."
            exit 1
          fi
      - name: Identifier et optimiser les dix médias officiels du dépôt
        run: python3 scripts/installer-medias-sde.py
      - run: npm run build:experience
      - name: Garantir une affiche mobile réellement plus légère
        run: |
          node -e "const fs=require('node:fs'); const a=fs.statSync('public/vitrine/illus/tpa-2026.webp').size,b=fs.statSync('public/vitrine/illus/tpa-2026-mobile.webp').size;console.log('WebP mobile',b,'sur',a,'octets'); if(b>=a)process.exit(1);"
      - run: npm test

  deployer:
    needs: verifier
    runs-on: ubuntu-24.04
    concurrency:
      group: sde-cloudflare-deploiement-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts
      - name: Installer ImageMagick pour les ressources Web
        run: |
          # Éviter la dépendance APT si FFmpeg ou ImageMagick est déjà présent.
          # Le build utilise un fallback WebP natif FFmpeg et préserve les sources.
          if command -v convert >/dev/null 2>&1; then
            convert -version | head -1
          elif command -v magick >/dev/null 2>&1; then
            magick -version | head -1
          elif command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome disponible pour l'encodeur WebP local."
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "::error::Aucun encodeur WebP (ImageMagick/FFmpeg/Chrome) disponible."
            exit 1
          fi
      - name: Identifier et optimiser les dix médias officiels du dépôt
        run: python3 scripts/installer-medias-sde.py
      - run: npm run build:experience
      - name: Garantir une affiche mobile réellement plus légère
        run: |
          node -e "const fs=require('node:fs'); const a=fs.statSync('public/vitrine/illus/tpa-2026.webp').size,b=fs.statSync('public/vitrine/illus/tpa-2026-mobile.webp').size;console.log('WebP mobile',b,'sur',a,'octets'); if(b>=a)process.exit(1);"
      - run: node scripts/version-chemins.mjs
      - name: Éviter de republier une ancienne révision
        id: dernier
        shell: bash
        run: |
          HEAD_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$HEAD_SHA" ]; then
            echo "Impossible de vérifier le dernier commit" >&2
            exit 1
          fi
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then
            echo "deployer=true" >> "$GITHUB_OUTPUT"
            echo "Révision à jour : publication autorisée."
          else
            echo "deployer=false" >> "$GITHUB_OUTPUT"
            echo "Une révision plus récente existe : publication de celle-ci ignorée."
          fi
      - if: steps.dernier.outputs.deployer == 'true'
        run: node scripts/deploy-cloudflare.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      - name: Vider le cache Cloudflare
        if: steps.dernier.outputs.deployer == 'true'
        run: node scripts/purge-cloudflare.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: Confirmer les routes et la révision publiée sur les deux domaines SDE
        if: steps.dernier.outputs.deployer == 'true'
        timeout-minutes: 20
        run: node scripts/attendre-publication-sde.mjs
        env:
          SDE_EXPECTED_REV: ${{ github.sha }}
      - name: Vérifier les routes publiques, la confidentialité anonyme et l'application sur les deux domaines
        if: steps.dernier.outputs.deployer == 'true'
        timeout-minutes: 15
        run: node scripts/recette-production.mjs
        env:
          SDE_EXPECTED_REV: ${{ github.sha }}
      - name: Vérifier l'Academy publiée sur les deux domaines (sans connexion ni écriture)
        if: steps.dernier.outputs.deployer == 'true'
        run: node scripts/recette-academy-production.mjs
      - name: Vérifier les dix médias SDE 2027 sur les deux domaines après publication
        if: steps.dernier.outputs.deployer == 'true'
        timeout-minutes: 8
        run: node scripts/verifier-medias-sde-publies.mjs
      - name: Vérifier les nouvelles routes de médiathèque et la protection administrateur
        if: steps.dernier.outputs.deployer == 'true'
        timeout-minutes: 8
        run: node scripts/recette-mediatheque-production.mjs
        env:
          SDE_EXPECTED_REV: ${{ github.sha }}
      - name: Valider les quatre miniatures WebP publiées sur les deux domaines
        if: steps.dernier.outputs.deployer == 'true'
        timeout-minutes: 5
        run: node scripts/verifier-archives-sde-publiees.mjs
