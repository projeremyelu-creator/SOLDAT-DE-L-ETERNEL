name: Vérifier les scripts
on:
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts
      - run: npm run build:experience
      - run: npm test
      - name: Diagnostic
        if: always()
        run: |
          npm test > /tmp/out.txt 2>&1 || true
          grep -nE "^\s*(not ok|error:|expected|actual|message:)|AssertionError|Error:" /tmp/out.txt | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
