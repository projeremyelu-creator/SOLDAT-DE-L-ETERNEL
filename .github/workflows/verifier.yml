name: Vérifier les scripts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Vérifier les quatre lots en production (lecture seule)
        run: node test/live-final-check.mjs
