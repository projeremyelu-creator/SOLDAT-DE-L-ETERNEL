name: Vérifier les scripts
on:
  pull_request:
concurrency:
  group: verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts
      - name: Installer l'encodeur WebP pour l'affiche mobile
        run: |
          # Éviter la dépendance APT si FFmpeg ou ImageMagick est déjà présent.
          # Le build utilise un fallback WebP natif FFmpeg et préserve les sources.
          if command -v convert >/dev/null 2>&1; then
            convert -version | head -1
          elif command -v magick >/dev/null 2>&1; then
            magick -version | head -1
          elif command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome disponible pour l'encodeur WebP local."
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "::error::Aucun encodeur WebP (ImageMagick/FFmpeg/Chrome) disponible."
            exit 1
          fi
      - name: Vérifier la syntaxe du contrôle des fiches privées
        run: node --check scripts/audit-prive-authentifie.mjs
      - run: npm run build:experience
      - name: Garantir une affiche mobile réellement plus légère
        run: |
          node -e "const fs=require('node:fs'); const a=fs.statSync('public/vitrine/illus/tpa-2026.webp').size,b=fs.statSync('public/vitrine/illus/tpa-2026-mobile.webp').size;console.log('WebP mobile',b,'sur',a,'octets'); if(b>=a)process.exit(1);"
      - name: Run npm test (limite contrôlée)
        timeout-minutes: 8
        run: npm test
