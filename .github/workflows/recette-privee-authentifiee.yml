name: Recette privée authentifiée SDE — comptes de test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recette-privee-authentifiee.yml'
      - 'src/**'
      - 'frontend/**'
      - 'public/**'
      - 'scripts/audit-prive-authentifie.mjs'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: recette-privee-authentifiee-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-avec-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - name: Vérifier la configuration des comptes de recette
        id: comptes
        shell: bash
        env:
          SDE_QA_MEMBER_LOGIN: ${{ secrets.SDE_QA_MEMBER_LOGIN }}
          SDE_QA_MEMBER_PASSWORD: ${{ secrets.SDE_QA_MEMBER_PASSWORD }}
          SDE_QA_ADMIN_LOGIN: ${{ secrets.SDE_QA_ADMIN_LOGIN }}
          SDE_QA_ADMIN_PASSWORD: ${{ secrets.SDE_QA_ADMIN_PASSWORD }}
        run: |
          if [[ -n "$SDE_QA_MEMBER_LOGIN" && -n "$SDE_QA_MEMBER_PASSWORD" && -n "$SDE_QA_ADMIN_LOGIN" && -n "$SDE_QA_ADMIN_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Recette privée obligatoire : configurez les quatre secrets SDE_QA_MEMBER_* et SDE_QA_ADMIN_*."
            echo "### Recette privée non exécutée" >> "$GITHUB_STEP_SUMMARY"
            echo "Les comptes de test dédiés ne sont pas encore configurés dans les secrets GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Exiger les comptes de test pour la recette privée
        if: steps.comptes.outputs.configured != 'true'
        run: |
          echo "::error::La recette authentifiée ne peut pas être considérée comme réussie sans comptes de test membre et administrateur."
          exit 1
      - name: Vérifier le script de recette
        run: node --check scripts/audit-prive-authentifie.mjs
      - name: Installer Chromium sans toucher aux données
        if: steps.comptes.outputs.configured == 'true'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Vérifier les parcours connectés des comptes de test dédiés
        if: steps.comptes.outputs.configured == 'true'
        run: node scripts/audit-prive-authentifie.mjs
        env:
          SDE_QA_MEMBER_LOGIN: ${{ secrets.SDE_QA_MEMBER_LOGIN }}
          SDE_QA_MEMBER_PASSWORD: ${{ secrets.SDE_QA_MEMBER_PASSWORD }}
          SDE_QA_ADMIN_LOGIN: ${{ secrets.SDE_QA_ADMIN_LOGIN }}
          SDE_QA_ADMIN_PASSWORD: ${{ secrets.SDE_QA_ADMIN_PASSWORD }}
