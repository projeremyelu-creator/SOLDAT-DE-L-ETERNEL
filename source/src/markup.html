<header class="hdr">
  <div class="hdr-in">
    <button class="brand" id="brand" type="button" aria-label="Retour à l’accueil">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand-txt"><span class="brand-mark" id="brand-mark">S.D.E.</span><span class="brand-sub" id="brand-sub">Gestion du mouvement</span></span>
    </button>
    <span class="sync wait" id="sync" role="status"><i></i><span class="sync-t" id="sync-t">Connexion…</span></span>
    <button class="hdr-btn" id="btn-reglages" type="button" aria-label="Réglages et données"><svg class="ico"><use href="#i-sliders"/></svg></button>
  </div>
</header>
<div id="banner"></div>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main class="main" id="main" tabindex="-1">
    <div class="view">

      <p class="loading"><i></i>Chargement des données du mouvement…</p>
    </div>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
