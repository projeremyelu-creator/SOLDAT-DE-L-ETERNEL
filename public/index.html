  /* Messages ciblés */
  const AUDIENCES = [
    ["tous", "Tous les membres actifs"], ["pole", "Un pôle"], ["garnison", "Une garnison"], ["formation", "Les participants d’une formation"], ["statut", "Un statut"],
    ["suivi", "Les membres à suivre (absents)"], ["anniv", "Les anniversaires des 7 prochains jours"], ["chaine", "Les intercesseurs de la chaîne de prière"], ["cotis", "Les membres en retard de cotisation"], ["manuel", "Une sélection de membres"],
  ];
  const audiencesPermises = () => AUDIENCES.filter(([k]) => k !== "cotis" || accesDirection());
  function valeursAudience(type) {
    if (type === "pole") return cfg().poles.map((p) => [p, p]);
    if (type === "garnison") return optionsGarnisons();
    if (type === "formation") return S.formations.slice().sort((a, b) => cmpFr(b.dateDebut || "", a.dateDebut || "")).map((f) => [f.id, f.titre]);
    if (type === "statut") return cfg().statuts.map((s) => [s, s]);
    if (type === "chaine") return [["jour", "Intercesseurs d’aujourd’hui"], ["tous", "Tous les intercesseurs de la semaine"]];
    return null;
  }
  function destinatairesDe(aud) {
    const actifs = membresActifs();
    const t = aud.type, v = aud.valeur;
    let l = [];
    if (t === "tous") l = actifs;
    else if (t === "pole") l = actifs.filter((m) => m.pole === v);
    else if (t === "garnison") l = actifs.filter((m) => dansG(m, v));
    else if (t === "formation") { const f = formation(v); l = f ? participantsF(f).filter(({ p }) => p.statut !== "Abandon").map(({ m }) => m).filter((m) => m.actif !== false) : []; }
    else if (t === "statut") l = actifs.filter((m) => m.statut === v);
    else if (t === "suivi") l = suiviPastoral().liste;
    else if (t === "anniv") l = actifs.filter((m) => { const a = prochainAnniv(m); return a && a.dans <= 7; });
    else if (t === "chaine") { const ids = new Set(v === "tous" ? intercesseursSemaine() : intercesseursDuJour(aujourdhui()).flatMap((x) => x.ids)); l = actifs.filter((m) => ids.has(m.id)); }
    else if (t === "cotis") { const an = new Date().getFullYear(); l = accesDirection() ? actifs.filter((m) => etatCotis(m, an).retard.length) : []; }
    else if (t === "manuel") { const ids = new Set(aud.ids || []); l = actifs.filter((m) => ids.has(m.id)); }
    return l.map((m) => m.id);
  }
  function libAudience(aud) {
    const base = (AUDIENCES.find(([k]) => k === aud.type) || [0, "Destinataires"])[1];
    const vals = valeursAudience(aud.type);
    const v = vals ? (vals.find(([k]) => k === aud.valeur) || [0, ""])[1] : "";
    if (aud.type === "pole" || aud.type === "garnison" || aud.type === "statut") return v ? `${aud.type === "pole" ? "Pôle" : aud.type === "garnison" ? "Garnison" : "Statut"} : ${v.replace(/^(— )+/, "")}` : base;
    if (aud.type === "formation") return v ? `Formation : ${v}` : base;
    if (aud.type === "chaine") return v || base;
    return base;
  }
  const MODELES = [["libre", "Message libre"], ["rassemblement", "Annonce d’un rassemblement"], ["convocation", "Convocation à une réunion"], ["priere", "Appel à la prière"], ["formation", "Rappel de formation"], ["cotis", "Rappel de cotisation"]];
  function texteModele(type, { evtId, formationId } = {}) {
    const c = cfg();
    if (type === "rassemblement") {
      const e = evt(evtId);
      if (!e) return "";
      return `Bonjour {prenom} ! ${e.titre} : ${fmtLong(e.date)}${e.heure ? " à " + fmtHeure(e.heure) : ""}${e.lieu ? ", " + e.lieu : ""}.${e.description ? "\n" + e.description : ""}\nNous comptons sur ta présence. Que Dieu te bénisse !\n— ${c.nomCourt}`;
    }
    if (type === "convocation") return `Bonjour {prenom}, que la paix du Seigneur soit avec toi. Tu es convoqué(e) à une réunion le [date] à [heure], [lieu].\nOrdre du jour : [à préciser].\nTa présence est importante.\n— ${c.nomCourt}`;

    if (type === "formation") {

  function ouvrirCompose(preset = {}) {

        $s("#d-evt").addEventListener("change", majModele);
        $s("#d-fo").addEventListener("change", majModele);

        $s("#d-pick-q").addEventListener("input", (ev) => { const q = norm(ev.target.value); sheet.querySelectorAll(".pick-l").forEach((l) => { l.hidden = !!q && !l.dataset.n.includes(q); }); });
        majValeurs(true); majModele(); majCompte();
      },

  async function enregistrerDiffusion(fd, form) {
    const g = (k) => String(fd.get(k) || "").trim();

    const ids = destinatairesDe(aud);
    if (!ids.length) { erreurForm("Aucun destinataire : changez le choix des destinataires."); return; }
    const message = g("message").replace(/\{mouvement\}/g, cfg().nomCourt);

    const titre = g("titre") || message.replace(/\{prenom\}/g, "").replace(/\s+/g, " ").slice(0, 60);

    const ref = S.db.collection("diffusions").doc();
    const ok = await ecrire(() => ref.set({ titre, message, audience: { type: aud.type, valeur: aud.type === "manuel" ? "" : aud.valeur, lib: libAudience(aud) }, destinataires: ids, envoyes: {}, ...creation() }), "Message prêt à envoyer");
    if (ok) ouvrirDiffusion(ref.id); else form.querySelector("[type=submit]").disabled = false;
  }

        Object.assign(data, { fichierId: res.id, fichierNom: fichier.name, fichierType: fichier.type, fichierTaille: res.sizeBytes || fichier.size });

      const nva = niveauAtteint(m.id);
      if (nva > 0 || fs.some(({ f }) => niveauFormation(f))) {

          const cls = pr.certifiees > 0 ? "ok" : pr.enCours ? "info" : "";
          out += `<span class="chip ${cls}" style="${cls === "ok" ? `background:${nv.couleur};color:#fff;border-color:${nv.couleur}` : cls === "info" ? `border-color:${nv.couleur};color:${nv.couleur}` : ""}">${esc(nv.court)}${pr.certifiees > 0 ? " ✓" : ""}</span>`;

      }
      out += `<h3 class="h3">Formations</h3>` + (fs.length ? `<div class="list">${fs.map(({ f, p }) => {

      }).join("")}</div>` : `<p class="hint">Aucune formation suivie.</p>`);
    }
    if (S.pret.chaine) {
      const cr = creneauxDe(m.id);
      if (cr.length) out += `<h3 class="h3">Chaîne de prière</h3><p class="hint">${esc(cr.join(" · "))}</p>`;

    }
    return out;
  }

  function lireLignesBudget(texte, anciens) {
    const pris = new Set();
    return String(texte || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((l, i) => {
      const r = /^(.*?)[\s:=–—-]+([\d][\d\s.  ]*)\s*(f\s?cfa|fcfa|f)?$/i.exec(l);
      const libelle = (r ? r[1] : l).replace(/[\s:=–—-]+$/, "").trim() || l;
      const montant = r ? Number(r[2].replace(/\D/g, "")) || 0 : 0;
      const ancien = anciens.find((a) => !pris.has(a.id) && norm(a.libelle) === norm(libelle));
      const id = ancien ? ancien.id : nouvelId("l");
      pris.add(id);
      return { id, libelle, montant, ordre: i };
    });
  }

  /* Animation : souffle de l’Esprit (particules qui montent de la vallée) */
  function initHero() {
    const cv = $("#hero-cv");
    if (!cv) { cancelAnimationFrame(HERO.raf); HERO.raf = 0; HERO.cv = null; clearInterval(HERO.timer); HERO.timer = 0; clearInterval(HERO.cd); HERO.cd = 0; HERO.anime = false; return; }
    const reduit = matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (HERO.cv !== cv) {
      HERO.cv = cv;
      const r = cv.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
      if (!HERO.parts.length) for (let i = 0; i < 70; i += 1) HERO.parts.push(nouvellePart(cv, true));
      if (!reduit && !HERO.raf) HERO.raf = requestAnimationFrame(boucleHero);
      if (reduit) dessinerHero();
    }
    if (!HERO.timer && !reduit) HERO.timer = setInterval(() => { if (document.hidden) return; changerVerset((HERO.idx + 1) % EZ37.length); }, 9000);
    if (!HERO.cd) HERO.cd = setInterval(majDecompte, 1000);
    if (!HERO.anime) { HERO.anime = true; animerCompteurs(); }
  }
  function nouvellePart(cv, partout) {
    const w = cv.width, h = cv.height;
    return { x: Math.random() * w, y: partout ? Math.random() * h : h + Math.random() * 40, r: 0.6 + Math.random() * 2.2, v: 0.15 + Math.random() * 0.55, a: 0.15 + Math.random() * 0.6, o: Math.random() * Math.PI * 2 };
  }
  function dessinerHero() {
    const cv = HERO.cv;
    if (!cv) return;
    const x = cv.getContext("2d");
    x.clearRect(0, 0, cv.width, cv.height);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const p of HERO.parts) {
      const g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4 * dpr);
      g.addColorStop(0, `rgba(255,214,120,${p.a})`); g.addColorStop(1, "rgba(255,170,60,0)");
      x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, p.r * 4 * dpr, 0, Math.PI * 2); x.fill();
    }
  }
  function boucleHero() {

    if (!document.hidden) {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const boost = 1 + HERO.souffle * 6;
      for (const p of HERO.parts) {
        p.o += 0.02;
        p.y -= p.v * dpr * boost;
        p.x += Math.sin(p.o) * 0.35 * dpr + (HERO.souffle ? (p.x < cv.width / 2 ? -1 : 1) * HERO.souffle * 1.2 * dpr : 0);
        if (p.y < -10 || p.x < -20 || p.x > cv.width + 20) Object.assign(p, nouvellePart(cv, false));
      }
      if (HERO.souffle) HERO.souffle = Math.max(0, HERO.souffle - 0.008);

    zip.file("xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook ${NS}><sheets>${fs.map((f, i) => `<sheet name="${xmlEsc(f.nom)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets>${fs.some((f) => f.rows.length > 1) ? `<definedNames>${fs.map((f, i) => (f.rows.length > 1 ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xmlEsc(f.nom).replace(/'/g, "''")}'!$A$1:$${colXl(Math.max(1, ...f.rows.map((r) => r.length)) - 1)}$${f.rows.length}</definedName>` : "")).join("")}</definedNames>` : ""}</workbook>`);

  /* Chaque soldat reçoit un code personnel (ex. K7PM-Q2XD). La direction publie pour lui un résumé chiffré

  const ESP = { code: "", data: null, t: 0, err: "", charge: false, rafraichi: false, cle: new Map(), cartes: "", envoi: false };

  const LIEN_APP = "https://app.mouvement-sde.org";

  const telContact = () => String(cfg().contactPriere || "").trim() || ((String(cfg().contactCarte || DEFAUTS.contactCarte || "").match(/\+?[\d][\d\s]{7,}/) || [""])[0]).trim();
  function nouveauCode() {
    const a = new Uint32Array(8);

    const n = normCode(code);

    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(n.replace("-", "")), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode("sde-espace-v1"), iterations: 200000 }, base, 384));

  async function dechiffrer(code, doc) {

  /* ── Heatmap d'assiduité (6 derniers mois) ── */
  function heatmapPresences(pr) {
    const liste = pr.liste || [];
    if (liste.length < 3) return "";
    const parDate = {};
    for (const x of liste) parDate[x.date] = x.etat;
    const aujourdhuiStr = new Date().toISOString().slice(0, 10);
    const il6m = new Date(); il6m.setMonth(il6m.getMonth() - 6);
    const semaines = [];
    let d = new Date(il6m);
    d.setDate(d.getDate() - d.getDay());
    while (d.toISOString().slice(0, 10) <= aujourdhuiStr) {
      const sem = [];
      for (let j = 0; j < 7; j++) {
        const iso = d.toISOString().slice(0, 10);
        const etat = parDate[iso];
        sem.push({ date: iso, etat: etat || null, futur: iso > aujourdhuiStr });
        d.setDate(d.getDate() + 1);
      }
      semaines.push(sem);
    }
    const couleurs = { P: "var(--ok)", R: "var(--warn)", E: "var(--info)", A: "var(--danger)" };
    return `<section class="card"><p class="eyebrow">Calendrier d'assiduité</p><div class="heatmap" role="img" aria-label="Assiduité sur 6 mois">${semaines.map((s) => `<div class="hm-sem">${s.map((j) => `<div class="hm-j${j.futur ? " futur" : ""}" style="background:${j.etat ? couleurs[j.etat] : "var(--bg3)"}" title="${j.date}${j.etat ? " · " + (ETAT_PRES[j.etat] || [""])[0] : ""}"></div>`).join("")}</div>`).join("")}</div><div class="hm-leg"><span class="hm-l"><span class="hm-c" style="background:var(--ok)"></span>Présent</span><span class="hm-l"><span class="hm-c" style="background:var(--warn)"></span>Retard</span><span class="hm-l"><span class="hm-c" style="background:var(--info)"></span>Excusé</span><span class="hm-l"><span class="hm-c" style="background:var(--danger)"></span>Absent</span></div></section>`;
  }

  function parseCSV(texte) {
    texte = String(texte || "").replace(/^﻿/, "");
    const premiere = texte.split(/\r?\n/).find((l) => l.trim()) || "";
    const sep = ["\t", ";", ","].map((s) => [s, premiere.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
    const lignes = [];
    let ligne = [], cell = "", q = false;
    for (let i = 0; i < texte.length; i += 1) {
      const ch = texte[i];
      if (q) {
        if (ch === '"') { if (texte[i + 1] === '"') { cell += '"'; i += 1; } else q = false; } else cell += ch;
      } else if (ch === '"' && cell === "") q = true;
      else if (ch === sep) { ligne.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && texte[i + 1] === "\n") i += 1;
        ligne.push(cell); cell = "";
        if (ligne.some((c) => c.trim())) lignes.push(ligne);
        ligne = [];
      } else cell += ch;
    }
    ligne.push(cell);
    if (ligne.some((c) => c.trim())) lignes.push(ligne);
    return lignes;
  }

  function lireDate(v, anneeRequise) {
    v = String(v || "").trim();
    if (!v) return null;
    const mk = (j, m, y) => {
      j = Number(j); m = Number(m); y = y ? Number(y) : null;
      if (y && y < 100) y += y > new Date().getFullYear() % 100 ? 1900 : 2000;
      if (!(m >= 1 && m <= 12) || !(j >= 1 && j <= joursDuMois(m, y))) return null;
      if (y && (y < 1900 || y > new Date().getFullYear())) return null;
      if (anneeRequise && !y) return null;
      return { anniv: `${pad(m)}-${pad(j)}`, annee: y, iso: y ? `${y}-${pad(m)}-${pad(j)}` : null };
    };
    let r;
    if ((r = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return mk(r[3], r[2], r[1]);
    if ((r = v.match(/^(\d{1,2})[/.\- ](\d{1,2})(?:[/.\- ](\d{2,4}))?$/))) return mk(r[1], r[2], r[3]);
    const w = norm(v).replace(/,/g, " ");
    if ((r = w.match(/^(\d{1,2})(?:er)?\s+([a-z]+)\.?(?:\s+(\d{4}))?$/))) {
      const idx = MOIS_NOMS.map((n) => norm(n)).findIndex((n) => n === r[2] || (r[2].length >= 3 && n.startsWith(r[2])));
      if (idx >= 0) return mk(r[1], idx + 1, r[3]);
    }
    return null;
  }
  function analyserImport(texte) {
    const c = cfg();
    const lignes = parseCSV(texte);
    if (lignes.length < 2) return { erreur: "Le tableau doit contenir une ligne d’en-têtes (Nom, Prénoms, Téléphone…) puis au moins une ligne de membre." };
    const entetes = lignes[0].map((h) => norm(h).replace(/[^a-z0-9]/g, ""));
    const index = {};
    for (const [cle, alias] of Object.entries(COLONNES)) { const ii = entetes.map((h, i) => (alias.includes(h) ? i : -1)).filter((i) => i >= 0); if (ii.length) index[cle] = ii; }
    if (index.nom === undefined && index.complet === undefined) return { erreur: "Aucune colonne « Nom » n’a été trouvée dans la première ligne du tableau." };
    const reconnues = Object.values(index).flat().map((i) => lignes[0][i].trim());
    const existants = new Set(S.membres.flatMap((m) => [telChiffres(m.telephone) ? "t:" + telChiffres(m.telephone) : null, "n:" + norm((m.nom || "") + " " + (m.prenoms || "")), m.matricule ? "m:" + norm(m.matricule) : null]).filter(Boolean));
    const vus = new Set();
    const nouveaux = [];
    let doublons = 0, vides = 0, datesIgnorees = 0;
    for (const l of lignes.slice(1)) {
      const v = (k) => { for (const i of index[k] || []) { const x = String(l[i] ?? "").trim(); if (x) return x; } return ""; };
      let nom = v("nom"), prenoms = v("prenoms");
      if (!nom && v("complet")) {
        const mots = v("complet").split(/\s+/).filter(Boolean);
        const majIdx = mots.findIndex((w2) => w2.length > 1 && w2 === w2.toUpperCase() && /\p{L}/u.test(w2));
        if (majIdx > 0 && majIdx === mots.length - 1) { nom = mots[majIdx]; prenoms = mots.slice(0, -1).join(" "); }
        else { nom = mots[0] || ""; prenoms = mots.slice(1).join(" "); }
      }
      if (!nom) { vides += 1; continue; }
      const tel = v("telephone");
      const cleT = telChiffres(tel) ? "t:" + telChiffres(tel) : null;
      const cleN = "n:" + norm(nom + " " + prenoms);
      const cleM = v("matricule") ? "m:" + norm(v("matricule")) : null;
      if ((cleT && (existants.has(cleT) || vus.has(cleT))) || existants.has(cleN) || vus.has(cleN) || (cleM && (existants.has(cleM) || vus.has(cleM)))) { doublons += 1; continue; }
      if (cleM) vus.add(cleM);
      if (cleT) vus.add(cleT);
      vus.add(cleN);
      const nais = lireDate(v("naissance"), false);
      if (v("naissance") && !nais) datesIgnorees += 1;
      const adh = lireDate(v("adhesion"), true);
      const sx = norm(v("sexe"));
      const poleBrut = v("pole");
      const pole = poleBrut ? (c.poles.find((p) => norm(p) === norm(poleBrut) || norm(poleCourt(p)) === norm(poleBrut) || norm(poleCourt(p)) === "pole " + norm(poleBrut)) || c.poles.find((p) => norm(p).includes(norm(poleBrut))) || poleBrut) : "";
      const statutBrut = v("statut");
      const stN = norm(statutBrut);
      const inactif = /^(inactif|inactive|archive|archivee|ancien|ancienne)$/.test(stN);
      const statutLu = /^(actif|active|inactif|inactive|archive|archivee|ancien|ancienne)$/.test(stN) ? "Membre" : statutBrut;
      const bp = norm(v("baptise"));
      nouveaux.push({
        nom, prenoms, telephone: tel, telephone2: v("telephone2"), email: v("email"), quartier: v("quartier"), pole, departement: v("departement"), fonction: v("fonction"),
        statut: statutLu ? c.statuts.find((s) => norm(s) === norm(statutLu)) || statutLu : "", actif: !inactif,
        matricule: v("matricule").toUpperCase(), eglise: v("eglise"), implantation: v("implantation"), baptise: /^(oui|o|yes|x|1)$/.test(bp) ? "Oui" : /^(non|n|no|0)$/.test(bp) ? "Non" : "",
        sexe: /^(h|m|homme|masculin|garcon)$/.test(sx) ? "H" : /^(f|femme|feminin|fille)$/.test(sx) ? "F" : "",
        situation: v("situation"), anniv: nais ? nais.anniv : null, annee: nais ? nais.annee : null, adhesion: adh ? adh.iso : "", notes: v("notes"),
      });
    }
    return { nouveaux, doublons, vides, datesIgnorees, reconnues, total: lignes.length - 1 };
  }

  async function lancerImport() {
    const liste = importEnCours;
    if (!liste || !liste.length || !S.db) return;
    importEnCours = null;
    const b = document.querySelector("[data-act=imp-lancer]");

    const prog = $("#imp-prog"), etat = $("#imp-etat");
    if (prog) prog.hidden = false;
    let faits = 0, echecs = 0, arret = null;
    S.attente += 1; majSync();
    for (const m of liste) {
      const ref = S.db.collection("membres").doc();
      let ok = false;
      for (let essai = 0; essai < 4 && !ok && !arret; essai += 1) {
        try { await ref.set({ ...m, importe: true, ...creation() }); ok = true; }
        catch (e) {
          const code = e && e.code;
          if (code === "resource_exhausted" || code === "unavailable") { await sleep(1500 * (essai + 1)); continue; }
          if (code === "quota_exceeded" || code === "invalid_argument" || code === "revoked") arret = e;

      const t = $("#imp-etat"); if (t) t.textContent = `${nb(faits)} sur ${nb(liste.length)} enregistrés…`;

        const configResponse = await fetch("/api/vapid-public-key", {credentials:"same-origin",cache:"no-store"});
        const config = await configResponse.json();
        if (!configResponse.ok || !config.key) throw new Error("Le service de notifications doit être configuré par le responsable du site. Vos rappels restent disponibles dans le portail.");
        const perm = await Notification.requestPermission();
        if (perm !== "granted") { toast("Autorisation refusée par le navigateur.", "err"); render(); return; }
        if (location.hostname === "mouvement-sde.org") await navigator.serviceWorker.register("/sw-public.js", {scope:"/"});
        const reg = await navigator.serviceWorker.ready;
        const expectedKey = urlB64ToUint8Array(config.key);
        let sub = await reg.pushManager.getSubscription();
        if (sub?.options?.applicationServerKey) {
          const storedKey = new Uint8Array(sub.options.applicationServerKey);
          if (storedKey.length !== expectedKey.length || !storedKey.every((v,i) => v === expectedKey[i])) {
            if (!await sub.unsubscribe()) throw new Error("Impossible de renouveler l'ancien abonnement. Désactivez les notifications puis réessayez.");
            sub = null;
          }
        }
        sub = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: expectedKey });
        const j = sub.toJSON();
        await SDEH.pushSub({ endpoint: j.endpoint, keys: j.keys });
        toast("Votre abonnement aux notifications est enregistré.");
      } catch (e) { toast("Impossible d'activer les notifications : " + (e.message || e), "err"); }
      render();

      try {
        const toutes = [];
        let page = 1, pages = 1;
        while (page <= pages) {
          const r = await fetch("/api/formulaire-admin?page=" + page, { credentials: "same-origin",cache:"no-store" });
          if (!r.ok) throw new Error("Page du formulaire indisponible");
          const j = await r.json();
          if (!Array.isArray(j.reponses) || !Number.isInteger(j.pages) || j.pages < 1 || j.pages > 500)
            throw new Error("Réponse de pagination invalide");
          toutes.push(...j.reponses);
          pages = j.pages;
          page++;
        }
        if (!toutes.length) { toast("Aucune réponse à exporter."); return; }
        const cols = ["id", "nom", "prenom", "statut_matrimonial", "profession", "date_naissance", "lieu_naissance", "telephone", "email", "ville", "message", "satisfaction_2026", "activites_marquantes", "points_ameliorer", "propositions_2027", "domaines_prioritaires", "created_at"];

  window.addEventListener("offline", () => { S.enLigne = false; render(); });
  let jourAffiche = aujourdhui();
  setInterval(() => { if (aujourdhui() !== jourAffiche) { jourAffiche = aujourdhui(); render(); } }, 60000);

  /* ════════════════════════ Version hébergée : comptes par e-mail et mot de passe ════════════════════════ */
  const SDEH = window.SDE || { moi: { connecte: false, niveau: 0 } };
  const moiH = () => SDEH.moi || { connecte: false, niveau: 0 };
  const LIB_ROLE_H = { attente: "En attente", soldat: "Soldat", lecture: "Lecture seule", contributeur: "Contributeur", admin: "Administrateur", proprietaire: "Propriétaire", visiteur: "Visiteur" };
  const ROLES_H = [["soldat", "Soldat : son espace, l’agenda et les annonces"], ["contributeur", "Contributeur : registre, agenda, pointage, sans les finances"], ["admin", "Administrateur : tout, finances comprises"], ["lecture", "Lecture seule"], ["attente", "En attente (aucun accès interne)"]];
  const URL_APP_H = "https://app.mouvement-sde.org";
  const champMdp = (id, label, auto, hint) => champ(id, label, `<input class="inp" id="${id}" name="${id.replace(/^c[a-z]+-/, "")}" type="password" autocomplete="${auto}" minlength="${auto === "new-password" ? 8 : 4}" maxlength="200" required>`, { req: true, hint });
  const voirMdp = `<label class="check cnx-voir"><input type="checkbox" data-voir-mdp> Afficher le mot de passe</label>`;

  /* — Feuille de connexion : se connecter, créer son compte, activer un compte — */
  const CNX = { mode: "connexion", email: "" };
  function ficheConnexion() {
    const m = CNX.mode;
    const onglets = [["connexion", "Se connecter"], ["inscription", "Créer mon compte"], ["activation", "J’ai un code"]].map(([k, l]) => `<button class="cnx-o${k === m ? " on" : ""}" type="button" data-act="cnx-mode" data-m="${k}" aria-pressed="${k === m}">${l}</button>`).join("");
    const email = champ("cx-email", "Adresse e-mail", inp("cx-email", "email", CNX.email, 'type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required' + (m !== "inscription" ? " autofocus" : "")), { req: true });
    let corps;
    if (m === "connexion") corps = `${email}${champMdp("cx-mdp", "Mot de passe", "current-password")}${voirMdp}
      <p class="hint">Mot de passe oublié ? Un responsable vous donne un code pour en choisir un nouveau, à saisir dans « J’ai un code ».${telContact() ? ` <a class="link" href="${esc(lienWa(telContact(), "Shalom ! J’ai oublié mon mot de passe MPA SDE. Mon adresse e-mail : "))}" target="_blank" rel="noopener">Le demander par WhatsApp</a>` : ""}</p>${pied("Se connecter")}`;
    else if (m === "inscription") corps = `<p class="hint" style="margin-top:0;padding:10px 12px;background:rgba(226,194,106,.1);border-left:3px solid #e2c26a;border-radius:4px"><b style="color:#e2c26a">Accès immédiat.</b> Dès que vous validez ce formulaire, votre compte est actif, votre <b>matricule à 6 chiffres</b> est attribué, et votre espace soldat s’ouvre dans la foulée. Aucune validation du secrétariat n’est nécessaire.</p>
      <div class="f2">${champ("ci-prenoms", "Prénoms", inp("ci-prenoms", "prenoms", "", 'autocomplete="given-name" required autofocus maxlength="80"'), { req: true })}${champ("ci-nom", "Nom", inp("ci-nom", "nom", "", 'autocomplete="family-name" required maxlength="80"'), { req: true })}</div>
      ${champ("ci-tel", "Téléphone (WhatsApp)", inp("ci-tel", "telephone", "", 'type="tel" autocomplete="tel" inputmode="tel" maxlength="30" placeholder="07 00 00 00 00"'))}
      ${email}${champMdp("ci-mdp", "Choisissez un mot de passe", "new-password", "Au moins 8 caractères.")}${champMdp("ci-mdp2", "Confirmez le mot de passe", "new-password")}${voirMdp}
      <p class="hint">Déjà membre avec un matricule SDE-CI-… ? Inscrivez-vous normalement — votre nouveau matricule fonctionne tout de suite, le secrétariat reliera votre ancienne fiche quand il le peut, sans retarder votre accès.</p>${pied("Créer mon compte")}`;
    else corps = `<p class="hint" style="margin-top:0">Le secrétariat vous a remis un code d’activation (par exemple K7PM-Q2XD) pour ouvrir votre compte ou choisir un nouveau mot de passe.</p>${email}
      ${champ("ca-code", "Code d’activation", inp("ca-code", "code", "", 'autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="12" required placeholder="K7PM-Q2XD"'), { req: true })}
      ${champMdp("ca-mdp", "Nouveau mot de passe", "new-password", "Au moins 8 caractères.")}${champMdp("ca-mdp2", "Confirmez le mot de passe", "new-password")}${voirMdp}${pied("Activer et me connecter")}`;
    return `<div class="cnx-onglets" role="group" aria-label="Choix">${onglets}</div><form method="post" class="form cnx-form" id="f-cnx" data-mode="${m}" novalidate>${corps}</form>`;
  }
  function ouvrirConnexion(mode) {
    if (mode) CNX.mode = mode;
    ouvrir({ titre: CNX.mode === "inscription" ? "Créer mon compte" : CNX.mode === "activation" ? "Activer mon compte" : "Connexion", html: ficheConnexion(), onSubmit: soumettreConnexion });
  }
  async function soumettreConnexion(fd, form) {
    const g = (k) => String(fd.get(k) || "").trim();
    const mode = form.dataset.mode, email = g("email").toLowerCase();
    CNX.email = email;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { erreurForm("Indiquez une adresse e-mail valide."); return; }
    const mdp = String(fd.get("mdp") || "");
    if (mode !== "connexion" && mdp.length < 8) { erreurForm("Le mot de passe doit compter au moins 8 caractères."); return; }
    if (mode !== "connexion" && mdp !== String(fd.get("mdp2") || "")) { erreurForm("Les deux mots de passe ne sont pas identiques."); return; }
    if (mode === "inscription" && (!g("prenoms") || !g("nom"))) { erreurForm("Indiquez votre nom et vos prénoms."); return; }
    if (mode === "activation" && g("code").replace(/[^0-9a-z]/gi, "").length !== 8) { erreurForm("Le code d’activation compte 8 caractères, par exemple K7PM-Q2XD."); return; }
    const b = form.querySelector("[type=submit]");
    if (b) { b.disabled = true; b.textContent = "Un instant…"; }
    try {
      if (mode === "connexion") await SDEH.connexion(email, mdp);
      else if (mode === "inscription") {
        const r = await SDEH.inscription({ email, motDePasse: mdp, prenoms: g("prenoms"), nom: g("nom"), telephone: g("telephone") });
        /* Mémorise le matricule pour un accueil nominatif après rechargement */
        try { sessionStorage.setItem("sde-bienvenue", JSON.stringify({ matricule: r && r.matricule, prenoms: g("prenoms") })); } catch (e) {}
        location.hash = "#espace";
      }
      else await SDEH.activation({ email, code: g("code"), motDePasse: mdp });
      location.reload();
    } catch (e) {
      if (e && e.code === "activation") { CNX.mode = "activation"; ouvrirConnexion(); erreurForm(e.message); return; }
      erreurForm((e && e.message) || "La connexion a échoué. Réessayez.");
      if (b) { b.disabled = false; b.textContent = mode === "connexion" ? "Se connecter" : mode === "inscription" ? "Créer mon compte" : "Activer et me connecter"; }
    }
  }
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t && t.matches && t.matches("[data-voir-mdp]")) { const f = t.closest("form"); if (f) f.querySelectorAll('input[name^="mdp"], input[name="ancien"], input[name="nouveau"], input[name="nouveau2"]').forEach((i) => { i.type = t.checked ? "text" : "password"; }); }
  });

  /* — Changer son mot de passe — */
  function ouvrirMotDePasse() {
    ouvrir({ titre: "Changer mon mot de passe", html: `<form method="post" class="form" id="f-mdp" novalidate>${champ("cm-ancien", "Mot de passe actuel", '<input class="inp" id="cm-ancien" name="ancien" type="password" autocomplete="current-password" required autofocus>', { req: true })}${champ("cm-nouveau", "Nouveau mot de passe", '<input class="inp" id="cm-nouveau" name="nouveau" type="password" autocomplete="new-password" minlength="8" required>', { req: true, hint: "Au moins 8 caractères." })}${champ("cm-nouveau2", "Confirmez le nouveau mot de passe", '<input class="inp" id="cm-nouveau2" name="nouveau2" type="password" autocomplete="new-password" required>', { req: true })}${voirMdp}${pied("Enregistrer")}</form>`,
      onSubmit: async (fd, form) => {
        const n = String(fd.get("nouveau") || "");
        if (n.length < 8) { erreurForm("Le nouveau mot de passe doit compter au moins 8 caractères."); return; }
        if (n !== String(fd.get("nouveau2") || "")) { erreurForm("Les deux mots de passe ne sont pas identiques."); return; }
        try { await SDEH.motDePasse({ ancien: String(fd.get("ancien") || ""), nouveau: n }); fermer(); toast("Mot de passe modifié. Vos autres appareils sont déconnectés."); }
        catch (e) { erreurForm((e && e.message) || "Modification impossible."); }
      } });
  }

  /* — Préférences de notification — */
  function ouvrirPrefsNotif() {
    const p = prefsNotif();
    const html = `<form method="post" class="form" id="f-prefs-notif" novalidate>
      <p class="hint">Choisissez les catégories pour lesquelles un indicateur apparaît dans la navigation lorsqu'il y a du nouveau.</p>
      <label class="check"><input type="checkbox" name="annonces" value="1"${p.annonces ? " checked" : ""}> Nouvelles annonces (Porte-Voix)</label>
      <label class="check"><input type="checkbox" name="diffusions" value="1"${p.diffusions ? " checked" : ""}> Nouveaux messages ciblés</label>
      <label class="check"><input type="checkbox" name="prieres" value="1"${p.prieres ? " checked" : ""}> Nouvelles requêtes de prière</label>
      <label class="check"><input type="checkbox" name="rappels" value="1"${p.rappels ? " checked" : ""}> Rappels du jour</label>
      <div class="sheet-f"><button class="btn btn-primary" type="submit">${I("i-check")}Enregistrer</button> <button class="btn btn-ghost" type="button" data-act="tout-lu">Tout marquer comme lu</button></div>
    </form>`;
    ouvrir({ titre: "Préférences de notification", html, onSubmit: (fd) => {

      fermer(); toast("Préférences enregistrées"); render();
    } });

  /* — Mon compte — */
  function blocCompteH() {
    const m = moiH();
    if (!m.connecte) return `<section class="card compte-h"><h2 class="h3">Mon compte</h2><p class="hint">Créez votre compte avec votre adresse e-mail : vous recevez aussitôt votre matricule, votre carte de membre et votre espace soldat.</p><div class="btn-row">${btn("inscription", "Créer mon compte", { ico: "i-plus", cls: "btn-primary" })}${btn("connexion", "Se connecter", { ico: "i-lock" })}</div></section>`;
    return `<section class="card compte-h"><h2 class="h3">Mon compte</h2><p style="margin:0"><b>${esc(m.nom || m.email)}</b></p><p class="hint" style="margin:2px 0 10px">${esc(m.email)} · ${esc(LIB_ROLE_H[m.role] || m.libRole || "")}${m.matricule ? ` · matricule <b class="num">${esc(m.matricule)}</b>` : ""}</p>${m.role === "attente" ? `<p class="note warn">Votre compte attend qu’un administrateur vous attribue un rôle.</p>` : ""}<div class="btn-row">${m.membreId ? btn("aller-espace", "Mon espace soldat", { ico: "i-card", sm: true, cls: "btn-primary" }) : ""}${m.niveau >= 2 ? btn("comptes", "Comptes et accès", { ico: "i-users", sm: true }) : ""}${btn("prefs-notif", "Notifications", { ico: "i-bell", sm: true })}${btn("mot-de-passe", "Changer mon mot de passe", { ico: "i-lock", sm: true })}${btn("deconnexion", "Se déconnecter", { sm: true })}</div></section>`;
  }
  (function boutonCompteH() {
    const ref = document.getElementById("btn-reglages");
    if (!ref || document.getElementById("btn-compte")) return;
    const m = moiH();
    const b = document.createElement("button");
    b.className = "hdr-btn hdr-compte" + (m.connecte ? " on" : "");
    b.id = "btn-compte"; b.type = "button"; b.dataset.act = "compte";
    b.setAttribute("aria-label", m.connecte ? "Mon compte : " + (m.nom || m.email) : "Se connecter");
    b.innerHTML = m.connecte ? `<span class="hdr-ini" aria-hidden="true">${esc(String(m.nom || m.email || "?").trim().split(/\s+/).map((x) => x[0]).slice(0, 2).join("").toUpperCase())}</span>` : I("i-lock");
    ref.parentNode.insertBefore(b, ref);
  })();
  const plusOrigH = VUES.plus;
  VUES.plus = function () { return blocCompteH() + plusOrigH(); };

  /* — Espace soldat d’un compte relié à une fiche — */
  const ESPC = { charge: false, data: null, err: "", majLe: null, demande: false };
  async function chargerEspaceCompte() {
    ESPC.charge = true; ESPC.demande = true;
    try {
      const r = await SDEH.monEspace();
      const an = new Date().getFullYear();
      const base = { v: 1, m: r.membre, garnisons: r.garnisons || [], presences: { taux: null, liste: [] }, cotis: { annee: an, mensuel: 0, payes: {}, dus: [], retard: [], verse: 0, exempt: false }, speciales: [], projets: [], offrandes: { annee: an, total: 0, n: 0 } };
      ESPC.data = r.resume ? { ...base, ...r.resume, m: { ...r.resume.m, ...r.membre } } : base;
      ESPC.majLe = r.resume ? r.majLe : null; ESPC.err = "";
    } catch (e) { ESPC.err = (e && e.message) || "Votre espace n’a pas pu être chargé."; }
    ESPC.charge = false;
    ESP.data = ESPC.data; ESP.code = ESPC.data ? "compte" : ""; ESP.t = ESPC.majLe || 0; ESP.cartes = ""; ESP.rafraichi = true;
    render();
  }
  const espaceOrigH = VUES.espace;
  VUES.espace = function () {
    const m = moiH();
    if (!m.connecte || !m.membreId) {
      const html = espaceOrigH();
      if (m.connecte) return html.replace(/<section class="card esp-entree">/, `<p class="note info">Votre compte n’est pas encore relié à une fiche de membre : le secrétariat peut le faire depuis « Comptes et accès ». En attendant, vous pouvez ouvrir votre espace avec un code personnel.</p><section class="card esp-entree">`);
      return html.replace(/<section class="card esp-entree">/, `<section class="card esp-compte"><div class="esp-entree-i" aria-hidden="true">${I("i-users")}</div><h2 class="h3">Créer mon compte soldat</h2><p class="hint">Avec votre adresse e-mail et un mot de passe. Vous recevez aussitôt votre matricule à 6 chiffres, votre carte de membre et votre espace.</p><div class="btn-row">${btn("inscription", "Créer mon compte", { ico: "i-plus", cls: "btn-primary" })}${btn("connexion", "Se connecter", { ico: "i-lock" })}</div></section><p class="hint esp-ou">Vous avez reçu un code personnel du secrétariat ? Il fonctionne toujours :</p><section class="card esp-entree">`);
    }
    const hd = secHead("Mon espace soldat", { eyebrow: "Espace personnel" });
    if (!ESPC.demande) { setTimeout(chargerEspaceCompte, 0); return hd + chargement("Ouverture de votre espace…"); }
    if (ESPC.charge && !ESPC.data) return hd + chargement("Ouverture de votre espace…");
    if (!ESPC.data) return hd + `<p class="note danger">${esc(ESPC.err)}</p><div class="btn-row">${btn("esp-recharger", "Réessayer", { ico: "i-undo" })}</div>`;
    const accueil = !ESPC.majLe ? `<p class="note info"><b>Bienvenue dans l’armée, ${esc(String(ESPC.data.m.prenoms || "").split(/\s+/)[0] || "soldat")} !</b> Votre matricule est <b class="num">${esc(ESPC.data.m.matricule || m.matricule)}</b>. Vos présences et vos cotisations s’afficheront ici dès la prochaine mise à jour du secrétariat.</p>` : "";
    return accueil + espaceSoldat(ESPC.data).replace(/<p class="hint esp-pied">[\s\S]*?<\/p>\s*$/, `<p class="hint esp-pied">${ESPC.majLe ? `Présences et cotisations mises à jour ${esc(relLong(isoJour(new Date(ESPC.majLe))))}. ` : ""}Matricule attribué à l’inscription. <button class="link" type="button" data-act="mot-de-passe">Changer mon mot de passe</button> · <button class="link" type="button" data-act="deconnexion">Se déconnecter</button> · <a class="link" href="/api/calendrier.ics" download>Exporter l’agenda (.ics)</a></p>`);
  };
  /* Requête de prière d’un compte : enregistrée directement dans la Chambre Haute */
  const deposerPriereOrigH = deposerPriere;
  deposerPriere = async function (fd, form) {
    const m = moiH();
    if (!m.connecte || !m.membreId || m.niveau >= 1 || fd.get("conf") === "1") return deposerPriereOrigH(fd, form);
    const sujet = String(fd.get("sujet") || "").trim();
    if (!sujet) { toast("Écrivez votre sujet de prière.", "err"); return; }
    ESP.envoi = true; render();
    try { await SDEH.priere({ sujet }); form.reset(); toast("Requête déposée : les intercesseurs prient pour vous."); }
    catch (e) { toast((e && e.message) || "La requête n’a pas pu être déposée.", "err"); }
    ESP.envoi = false; render();
  };

  /* — Direction : publie le résumé (présences, cotisations) de chaque compte relié à une fiche — */
  const SYNC_C = { t: 0, enCours: false, empreintes: new Map(), comptes: null, lu: 0 };
  function planifierSynchroComptes() {
    if (!peutAdmin() || !pretPourResume()) return;
    clearTimeout(SYNC_C.t);
    SYNC_C.t = setTimeout(synchroComptes, 5000);
  }
  async function synchroComptes() {
    if (SYNC_C.enCours || !peutAdmin() || !pretPourResume()) return;
    SYNC_C.enCours = true;
    try {
      if (!SYNC_C.comptes || Date.now() - SYNC_C.lu > 120000) {
        SYNC_C.comptes = ((await SDEH.comptes()).comptes || []).filter((c) => c.membreId); SYNC_C.lu = Date.now();
        if (!SYNC_C.empreintes.size) {
          const snap = await S.db.collection("espace_membre").get();
          snap.forEach((d) => SYNC_C.empreintes.set(d.id, (d.data() || {}).empreinte || ""));
        }
      }
      for (const c of SYNC_C.comptes) {
        const mb = membre(c.membreId);
        if (!mb) continue;
        const r = resumeSoldat(mb);
        const emp = await empreinte(JSON.stringify(r));
        if (SYNC_C.empreintes.get(mb.id) === emp) continue;
        await S.db.doc("espace_membre/" + mb.id).set({ resume: r, empreinte: emp, majLe: Date.now() });
        SYNC_C.empreintes.set(mb.id, emp);
        await sleep(120);
      }
    } catch (e) { /* nouvel essai au prochain changement */ }
    SYNC_C.enCours = false;
  }

  /* — Comptes et accès (administrateurs) — */
  const CPT = { liste: null, err: "", code: null, sauv: null };
  async function chargerComptes() {
    try { const r = await SDEH.comptes(); CPT.liste = r.comptes || []; CPT.err = ""; SYNC_C.comptes = null; } catch (e) { CPT.err = (e && e.message) || "Lecture impossible."; }
    try { const r = await fetch("/api/sauvegardes", { credentials: "same-origin", cache: "no-store" }); CPT.sauv = r.ok ? (await r.json()).sauvegardes || [] : null; } catch (e) { CPT.sauv = null; }
    dernier.sheet = null; render();
  }
  function messageActivation(c) {
    return `Shalom${c.nom ? " " + c.nom.split(/\s+/)[0] : ""} !\n\nTon accès à MPA SDE est prêt.\n1. Ouvre ${URL_APP_H}\n2. Touche le cadenas, puis « J’ai un code »\n3. Saisis ton adresse ${c.email}, le code ${c.code} et choisis ton mot de passe.\n\nLe code est valable 14 jours et ne sert qu’une fois.\n— ${cfg().nomCourt}`;
  }
  function ficheComptes() {
    const m = moiH();
    if (CPT.err) return `<p class="note danger">${esc(CPT.err)}</p>`;
    if (!CPT.liste) return chargement("Chargement des comptes…");
    const opts = (r) => ROLES_H.filter(([k]) => k !== "admin" || m.niveau >= 3).map(([k, l]) => `<option value="${k}"${k === r ? " selected" : ""}>${esc(l.split(" :")[0])}</option>`).join("");
    const fiches = S.pret.membres ? membresActifs().slice().sort(parNom) : [];
    const pris = new Set(CPT.liste.map((c) => c.membreId).filter(Boolean));
    const nomFiche = (id) => { const f = id && membre(id); return f ? `${nomComplet(f)}${f.matricule ? " · " + f.matricule : ""}` : ""; };
    const imp = m.niveau >= 3 ? `<details class="imp-h"><summary>Transférer des données (propriétaire)</summary><p class="hint">Choisissez le fichier de transfert (.json) préparé à partir de la version Claude. Les documents existants portant le même nom sont remplacés.</p><label class="btn btn-sm" for="imp-fichier">${I("i-up")}Choisir le fichier</label><input type="file" id="imp-fichier" accept=".json,application/json" hidden><p class="hint" id="imp-msg" role="status"></p></details>` : "";

      <div id="med-choix" class="med-choix"></div>
      <div class="f2">${champ("med-c", "Catégorie", `<input class="inp" id="med-c" name="categorie" list="dl-med-c" autocomplete="off" placeholder="Enseignements, Louange…"><datalist id="dl-med-c">${cats.map((c) => `<option value="${esc(c)}"></option>`).join("")}</datalist>`)}${champ("med-v", "Qui peut voir ?", `<select class="inp" id="med-v" name="visibilite">${VIS_MED.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join("")}</select>`)}</div>
      ${champ("med-d", "Description (facultatif)", `<textarea class="inp" id="med-d" name="description" rows="3" maxlength="2000" placeholder="Orateur, date, thème, verset…"></textarea>`)}
      ${pied("Envoyer")}</form>`;
  }
  function majChoixMed(input) {
    const box = $("#med-choix");
    if (!box) return;
    const fs = [...(input.files || [])];
    const max = MED.espace ? MED.espace.fichierMax : Infinity;
    box.innerHTML = fs.map((f, i) => { const g = genreDe(f.name); const pb = !g ? "type non accepté" : f.size > max ? `trop lourd (${octets(max)} au maximum)` : ""; return `<div class="med-ligne${pb ? " ko" : ""}" data-i="${i}"><span class="med-ligne-i" aria-hidden="true">${I((GENRES_MED[g] || ["", "i-file"])[1])}</span><span class="med-ligne-c"><label class="sr" for="med-t-${i}">Titre de ${esc(f.name)}</label><input class="inp inp-sm" id="med-t-${i}" value="${esc(f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " "))}" maxlength="160"${pb ? " disabled" : ""}><small>${esc(f.name)} · ${esc(octets(f.size))}${pb ? ` · <b>${esc(pb)}</b>` : ""}</small><span class="med-barre" hidden><i id="med-p-${i}"></i></span><small class="med-etat" id="med-e-${i}"></small></span></div>`; }).join("");
  }
  async function miniatureMed(f, g) {
    const reduire = (src, w, h) => { const k = Math.min(1, 480 / Math.max(w, h)); const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k)); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", 0.72); };
    const url = URL.createObjectURL(f);
    const delai = (ms) => new Promise((_, ko) => setTimeout(() => ko(new Error("délai")), ms));
    try {
      if (g === "image" && !/\.heic$/i.test(f.name)) {
        const img = new Image(); img.src = url;
        await Promise.race([img.decode(), delai(8000)]);
        return reduire(img, img.naturalWidth, img.naturalHeight);
      }
      if (g === "video") {
        const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "metadata"; v.src = url;
        await Promise.race([new Promise((ok, ko) => { v.onloadeddata = ok; v.onerror = ko; }), delai(8000)]);
        v.currentTime = Math.min(2, (v.duration || 4) / 3);
        await Promise.race([new Promise((ok) => { v.onseeked = ok; }), delai(6000)]);
        return reduire(v, v.videoWidth, v.videoHeight);
      }
    } catch (e) { /* pas de miniature */ } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
    return null;
  }
  async function envoyerMedia(f, i, commun) {
    const etat = (t) => { const el = $("#med-e-" + i); if (el) el.textContent = t; };
    const barre = (x) => { const el = $("#med-p-" + i); if (el) { el.parentNode.hidden = false; el.style.width = Math.round(x * 100) + "%"; } };
    const g = genreDe(f.name);
    etat("Préparation…");
    const miniature = await miniatureMed(f, g);
    const titre = ($("#med-t-" + i) || {}).value || f.name;
    let r = await fetch("/api/medias", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...commun, titre, nom: f.name, taille: f.size, miniature }) });
    let j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || "Envoi refusé.");
    const { id, morceau, morceaux } = j;
    for (let k = 0; k < morceaux; k += 1) {
      let essai = 0;
      for (;;) {
        try {
          r = await fetch(`/api/medias/${id}/${k}`, { method: "PUT", credentials: "same-origin", body: f.slice(k * morceau, Math.min(f.size, (k + 1) * morceau)) });
          if (r.ok) break;
          j = await r.json().catch(() => ({}));
          throw new Error(j.message || "Morceau refusé.");
        } catch (e) { essai += 1; if (essai >= 4) { await fetch(`/api/medias/${id}`, { method: "DELETE", credentials: "same-origin" }).catch(() => {}); throw e; } etat(`Réseau instable, nouvel essai (${essai}/3)…`); await sleep(1500 * essai); }
      }
      barre((k + 1) / morceaux);
      etat(`${Math.round(((k + 1) / morceaux) * 100)} % · ${octets(Math.min(f.size, (k + 1) * morceau))} sur ${octets(f.size)}`);
    }
    r = await fetch(`/api/medias/${id}/fin`, { method: "POST", credentials: "same-origin" });
    j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || "Finalisation impossible.");
    etat("Envoyé ✓");
  }
  async function soumettreMedias(fd, form) {
    const input = $("#med-fichiers");
    const fs = [...((input && input.files) || [])];
    const max = MED.espace ? MED.espace.fichierMax : Infinity;
    const valides = fs.map((f, i) => ({ f, i })).filter(({ f }) => genreDe(f.name) && f.size <= max);
    if (!fs.length) { erreurForm("Choisissez au moins un fichier."); return; }
    if (!valides.length) { erreurForm("Aucun fichier accepté : vérifiez le type et la taille."); return; }
    const commun = { categorie: String(fd.get("categorie") || "").trim(), visibilite: String(fd.get("visibilite") || "membres"), description: String(fd.get("description") || "").trim() };
    const b = form.querySelector("[type=submit]");
    if (b) { b.disabled = true; b.textContent = "Envoi en cours…"; }
    let ok = 0;
    for (const { f, i } of valides) {
      try { await envoyerMedia(f, i, commun); ok += 1; } catch (e) { const el = $("#med-e-" + i); if (el) el.innerHTML = `<b class="ko">${esc((e && e.message) || "Échec de l’envoi.")}</b>`; }
    }
    if (b) { b.disabled = false; b.textContent = "Envoyer"; }
    toast(ok === valides.length ? pluriel(ok, "fichier ajouté", "fichiers ajoutés") + " à la médiathèque" : `${ok} sur ${valides.length} fichiers envoyés`, ok === valides.length ? "" : "err");
    await chargerMedias();
    if (ok === valides.length) fermer();
  }
  document.addEventListener("change", (ev) => { if (ev.target && ev.target.id === "med-fichiers") majChoixMed(ev.target); });

  /* — Modifier — */
  function ficheModifMedia(m) {
    return `<form method="post" class="form" id="f-med-modif" data-id="${esc(m.id)}" novalidate>${champ("mm-t", "Titre", inp("mm-t", "titre", m.titre, 'maxlength="160" required'), { req: true })}
      <div class="f2">${champ("mm-c", "Catégorie", `<input class="inp" id="mm-c" name="categorie" value="${esc(m.categorie || "")}" list="dl-mm-c" autocomplete="off"><datalist id="dl-mm-c">${CATS_MED.map((c) => `<option value="${esc(c)}"></option>`).join("")}</datalist>`)}${champ("mm-v", "Qui peut voir ?", `<select class="inp" id="mm-v" name="visibilite">${VIS_MED.map(([k, l]) => `<option value="${k}"${k === m.visibilite ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`)}</div>
      ${champ("mm-d", "Description", `<textarea class="inp" id="mm-d" name="description" rows="4" maxlength="2000">${esc(m.description || "")}</textarea>`)}${pied("Enregistrer")}</form>`;
  }
  async function enregistrerModifMedia(fd, form) {
    const id = form.dataset.id;
    const r = await fetch(`/api/medias/${id}`, { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ titre: String(fd.get("titre") || ""), categorie: String(fd.get("categorie") || ""), visibilite: String(fd.get("visibilite") || ""), description: String(fd.get("description") || "") }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { erreurForm(j.message || "Modification refusée."); return; }
    toast("Média modifié"); await chargerMedias(); ouvrirMedia(id);
  }

  Object.assign(A, {
    "med-ajouter": () => ouvrir({ titre: "Ajouter à la médiathèque", html: ficheAjoutMedia(), onSubmit: soumettreMedias, wide: true }),
    "med-ouvrir": (t) => ouvrirMedia(t.dataset.id),
    "med-recharger": () => { MED.err = ""; MED.liste = null; render(); },
    "med-copier": (t) => navigator.clipboard.writeText(t.dataset.lien).then(() => toast("Lien copié"), () => toast("Copie impossible", "err")),
    "med-modifier": (t) => { const m = (MED.liste || []).find((x) => x.id === t.dataset.id); if (m) ouvrir({ titre: "Modifier le média", html: ficheModifMedia(m), onSubmit: enregistrerModifMedia }); },
    "med-suppr": (t) => boutonArme(t, "Confirmer la suppression", async () => {
      const r = await fetch(`/api/medias/${t.dataset.id}`, { method: "DELETE", credentials: "same-origin" });
      if (!r.ok) { toast("Suppression refusée.", "err"); return; }
      toast("Média supprimé"); fermer(); await chargerMedias();
    }),
  });

  /* ════════════════════════ Démarrage ════════════════════════ */
  async function demarrer() {
    const h = (location.hash || "").replace("#", "");
    if (ONGLETS.some((o) => o.id === h)) S.vue = h;
    render();
    if (navigator.onLine === false && appliquerCache(null, true)) { S.etat = "pret"; S.horsLigne = true; render(); }
    const c = window.claude;
    if (!c || typeof c.use !== "function") { if (S.horsLigne) return; S.etat = "absent"; render(); return; }
    const sur = (p) => Promise.resolve(p).catch(() => null);
    const [db, user, dl, assets, sample] = await Promise.all([sur(c.use("db")), sur(c.use("user")), sur(c.use("downloads")), sur(c.use("assets")), sur(c.use("sample"))]);
    S.sample = sample;
    if (sample && typeof sample.limits === "function") sample.limits().then((l) => { IA.limites = l; render(); }).catch(() => { IA.limites = null; });
    S.user = user; S.dl = dl; S.assets = assets;
    if (user) {
      try { const me = await user.me(); S.me = { id: me.id || null, name: me.name || "" }; S.estProprio = !!me.isOwner; S.estAdmin = !!me.canEdit || S.estProprio; } catch (e) { /* lecture impossible */ }
      try { S.peutEcrire = await user.can("data.write"); } catch (e) { S.peutEcrire = null; }
      if (S.estAdmin) S.peutEcrire = true;
    }
    if (!db) {
      if (S.horsLigne || (navigator.onLine === false && appliquerCache(null, true))) { S.etat = "pret"; S.horsLigne = true; render(); return; }
      S.etat = "absent"; render(); return;
    }
    S.db = db;
    S.etat = "pret";
    if (!S.horsLigne && appliquerCache(S.me.id, false)) render();
    abonner();
    render();
  }
  demarrer();
})();
</script>
<script>
/* Bienvenue nouveau soldat — bannière inscription réussie, lue depuis sessionStorage.
   Déclenchée uniquement après une inscription réussie (voir soumettreConnexion). */
(() => {
  'use strict';
  let b;
  try { b = JSON.parse(sessionStorage.getItem('sde-bienvenue') || 'null'); } catch (e) { b = null; }
  if (!b || !b.matricule) return;
  try { sessionStorage.removeItem('sde-bienvenue'); } catch (e) {}

  const esc = (s) => String(s || '').replace(/[<>&"']/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' })[c]);
  const prenoms = (String(b.prenoms || '').trim().split(/\s+/)[0]) || 'Soldat';

  const style = document.createElement('style');
  style.textContent = '@keyframes bv-apparait{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes bv-voile{from{opacity:0}to{opacity:1}}';
  document.head.appendChild(style);

  const voile = document.createElement('div');
  voile.style.cssText = 'position:fixed;inset:0;z-index:99998;background:rgba(5,7,14,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:bv-voile .3s ease';

  const panneau = document.createElement('div');
  panneau.setAttribute('role', 'status');
  panneau.setAttribute('aria-live', 'polite');
  panneau.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99999;max-width:90vw;width:420px;background:linear-gradient(180deg,#0f1e3d,#0a0f1d);color:#eef0f5;border:2px solid #e2c26a;border-radius:16px;padding:28px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(226,194,106,.3);font-family:system-ui,-apple-system,"Atkinson Hyperlegible",sans-serif;animation:bv-apparait .35s cubic-bezier(.2,.9,.3,1.2)';
  panneau.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-family:\'Saira Condensed\',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.74rem;color:#e2c26a">' +
      '<span style="width:8px;height:8px;background:#e2c26a;border-radius:50%;box-shadow:0 0 10px #e2c26a"></span>' +
      'Enrôlement confirmé' +
    '</div>' +
    '<h2 style="font-family:\'Saira Condensed\',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:.02em;margin:0 0 8px;line-height:1.1">Bienvenue, ' + esc(prenoms) + '.</h2>' +
    '<p style="color:#a4adc4;font-size:.92rem;line-height:1.55;margin:0 0 18px">Votre compte est actif, votre espace soldat est ouvert. Aucune validation du secrétariat n\'est requise — vous êtes connecté directement.</p>' +
    '<div style="padding:14px 16px;background:rgba(226,194,106,.1);border:1px solid rgba(226,194,106,.3);border-left:3px solid #e2c26a;border-radius:6px;margin-bottom:18px">' +
      '<div style="font-family:\'DM Mono\',ui-monospace,monospace;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#a4adc4;margin-bottom:4px">Matricule attribué</div>' +
      '<div style="font-family:\'Saira Condensed\',sans-serif;font-size:2rem;font-weight:700;color:#e2c26a;letter-spacing:.1em;line-height:1">' + esc(b.matricule) + '</div>' +
    '</div>' +
    '<button type="button" style="width:100%;padding:12px 20px;background:linear-gradient(145deg,#e2c26a,#85650f);color:#0f1e3d;border:none;border-radius:999px;font-family:\'Saira Condensed\',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.88rem;cursor:pointer;min-height:44px">Entrer dans mon espace</button>';

  document.body.appendChild(voile);
  document.body.appendChild(panneau);
  const fermer = () => { voile.remove(); panneau.remove(); };
  panneau.querySelector('button').addEventListener('click', fermer);
  voile.addEventListener('click', fermer);
})();
</script>
