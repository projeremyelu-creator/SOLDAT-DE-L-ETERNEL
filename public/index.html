<script>/* Pont MPA SDE : fournit √† l'application la m√™me interface que dans Claude
   (window.claude.use("db" | "user" | "downloads" | "assets")), branch√©e sur le serveur Cloudflare. */
(function () {
  "use strict";
  const MOI = { connecte: false, id: null, nom: "", email: null, role: "visiteur", libRole: "Visiteur", niveau: 0, membreId: null, matricule: "" };
  const pret = fetch("/api/moi", { credentials: "same-origin", cache: "no-store" })
    .then((r) => r.json()).then((m) => Object.assign(MOI, m)).catch(() => MOI);
  const segs = (p) => String(p).split("/").filter(Boolean);
  const meta = { fromCache: false, hasPendingWrites: false };
  const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
  const ALPHA = "abcdefghijklmnopqrstuvwxyz0123456789";
  const nouvelId = () => { const a = new Uint8Array(20); crypto.getRandomValues(a); return [...a].map((x) => ALPHA[x % 36]).join(""); };
  const echec = (code, message) => Object.assign(new Error(message || code), { code });

  async function appel(url, corps, methode) {
    let r;
    try { r = await fetch(url, { method: methode || "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify(corps) }); }
    catch (e) { throw echec("unavailable", "R√©seau indisponible"); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw echec(j.erreur || (r.status === 403 ? "invalid_argument" : "unavailable"), j.message);
    return j;
  }
  const snapDoc = (path, exists, data) => ({ id: segs(path).pop(), ref: docRef(path), exists: !!exists, data: () => (exists ? clone(data) : undefined), metadata: meta });
  const snapQuery = (path, docs) => {
    const d = docs.map((x) => snapDoc(path + "/" + x.id, true, x.data));
    return { docs: d, size: d.length, empty: !d.length, metadata: meta, docChanges: () => [], forEach: (f) => d.forEach(f) };
  };

  /* Abonnements : interrogation group√©e du serveur toutes les quelques secondes */
  const abos = new Map();
  let n = 0, minuterie = 0, enCours = false, relance = false;
  function planifier(delai) { clearTimeout(minuterie); minuterie = setTimeout(synchroniser, delai); }
  async function synchroniser() {
    if (enCours) { relance = true; return; }
    if (!abos.size) return;
    if (document.hidden) { planifier(4000); return; }
    enCours = true;
    const liste = [...abos.entries()].map(([k, a]) => ({ k, type: a.type, path: a.path, order: a.order, limit: a.limit, rev: a.rev }));
    try {
      const { res } = await appel("/api/sync", { subs: liste });
      for (const [k, v] of Object.entries(res || {})) {
        const a = abos.get(k);
        if (!a) continue;
        a.rev = v.rev;
        try { a.next(a.type === "doc" ? snapDoc(a.path, v.exists, v.data) : snapQuery(a.path, v.docs || [])); } catch (e) { setTimeout(() => { throw e; }); }
      }
    } catch (e) { for (const a of abos.values()) if (a.err && e.code === "revoked") a.err(e); }
    enCours = false;
    if (relance) { relance = false; planifier(50); } else planifier(navigator.onLine === false ? 8000 : 4000);
  }
  function abonner(type, path, q, next, err) {
    const k = "s" + (n += 1);
    abos.set(k, { type, path, order: q.order || null, limit: q.limit || 0, rev: -1, next, err });
    planifier(0);
    return () => abos.delete(k);
  }
  const apresEcriture = () => planifier(120);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) planifier(0); });
  window.addEventListener("online", () => planifier(0));

  function docRef(path) {
    return {
      id: segs(path).pop(), path,
      get: async () => { const r = await appel("/api/db", { op: "get", path }); return snapDoc(path, r.exists, r.data); },
      set: async (data) => { await appel("/api/db", { op: "set", path, data }); apresEcriture(); },
      update: async (data) => { await appel("/api/db", { op: "update", path, data }); apresEcriture(); },
      delete: async () => { await appel("/api/db", { op: "delete", path }); apresEcriture(); },
      onSnapshot: (next, err) => abonner("doc", path, {}, next, err),
      collection: (sub) => collRef(path + "/" + sub),
    };
  }
  function requete(path, q) {
    return {
      where: () => { throw echec("invalid_argument", "where non pris en charge"); },
      orderBy: (champ, dir = "asc") => requete(path, { ...q, order: [champ, dir] }),
      limit: (k) => requete(path, { ...q, limit: k }),
      get: async () => { const r = await appel("/api/db", { op: "query", path, order: q.order, limit: q.limit }); return snapQuery(path, r.docs || []); },
      onSnapshot: (next, err) => abonner("query", path, q, next, err),
    };
  }
  function collRef(path) {
    return Object.assign(requete(path, {}), { path, id: segs(path).pop(), doc: (id) => docRef(path + "/" + (id || nouvelId())) });
  }
  const db = { doc: docRef, collection: collRef };

  const user = {
    isOwner: async () => (await pret, MOI.niveau >= 3),
    canEdit: async () => (await pret, MOI.niveau >= 2),
    can: async (nom) => { await pret; if (nom === "data.write") return MOI.niveau >= 1; if (nom === "assets.write" || nom === "files.write") return MOI.niveau >= 2; return false; },
    id: async () => (await pret, MOI.id),
    me: async () => { await pret; return { id: MOI.id, name: MOI.nom || "", avatarUrl: MOI.photo || "", email: MOI.email, isOwner: MOI.niveau >= 3, canEdit: MOI.niveau >= 2 }; },
    profiles: async (ids) => { try { return await appel("/api/profils", { ids }); } catch (e) { return {}; } },
    search: async () => [],
  };
  const downloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: /\.csv$/i.test(filename) ? "text/csv;charset=utf-8" : /\.html?$/i.test(filename) ? "text/html;charset=utf-8" : /\.json$/i.test(filename) ? "application/json" : "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      return { status: "saved" };
    },
  };
  const assets = {
    upload: async (blob, o) => {
      const r = await fetch("/api/fichiers", { method: "POST", credentials: "same-origin", headers: { "content-type": (o && o.type) || blob.type || "application/octet-stream" }, body: blob });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw echec(j.erreur || "unavailable", j.message);
      return j;
    },
    delete: async (id) => { await fetch("/api/fichiers/" + encodeURIComponent(id), { method: "DELETE", credentials: "same-origin" }); return { deleted: true }; },
    list: async () => ({ assets: [], usage: {} }),
  };

  /* √âli√©zer : m√™me interface que l'IA de Claude (texte en continu, outils ex√©cut√©s dans l'application) */
  async function tourIA(messages, outils, rapide, signal, surTexte) {
    let r;
    try { r = await fetch("/api/ia", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages, tools: outils, rapide }), signal }); }
    catch (e) { throw echec(e && e.name === "AbortError" ? "cancelled" : "unavailable", "R√©seau indisponible"); }
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw echec(j.erreur || "unavailable", j.message); }
    const lecteur = r.body.getReader(), dec = new TextDecoder();
    const blocs = []; let tampon = "", arret = null, texte = "";
    const traiter = (ev) => {
      if (ev.type === "content_block_start") blocs[ev.index] = ev.content_block.type === "tool_use" ? { type: "tool_use", id: ev.content_block.id, name: ev.content_block.name, json: "" } : { type: ev.content_block.type, text: "" };
      else if (ev.type === "content_block_delta") {
        const b = blocs[ev.index]; if (!b) return;
        if (ev.delta.type === "text_delta") { b.text += ev.delta.text; texte += ev.delta.text; surTexte(texte); }
        else if (ev.delta.type === "input_json_delta") b.json += ev.delta.partial_json;
      } else if (ev.type === "message_delta" && ev.delta && ev.delta.stop_reason) arret = ev.delta.stop_reason;
      else if (ev.type === "error") throw echec(ev.error && ev.error.type === "overloaded_error" ? "rate_limited" : "unavailable", ev.error && ev.error.message);
    };
    try {
      for (;;) {
        const { done, value } = await lecteur.read();
        if (done) break;
        tampon += dec.decode(value, { stream: true });
        let i;
        while ((i = tampon.indexOf("\n\n")) >= 0) {
          const bloc = tampon.slice(0, i); tampon = tampon.slice(i + 2);
          const data = bloc.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trim()).join("");
          if (data) traiter(JSON.parse(data));
        }
      }
    } catch (e) {
      if (e && e.code) throw Object.assign(e, { text: texte });
      throw Object.assign(echec(e && e.name === "AbortError" ? "cancelled" : "unavailable", "R√©ponse interrompue"), { text: texte });
    }
    const contenu = blocs.filter(Boolean).map((b) => b.type === "tool_use" ? { type: "tool_use", id: b.id, name: b.name, input: (() => { try { return b.json ? JSON.parse(b.json) : {}; } catch (e) { return {}; } })() } : b.type === "text" && b.text ? { type: "text", text: b.text } : null).filter(Boolean);
    return { contenu, arret, texte };
  }
  async function echantillon(entree, o = {}) {
    await pret;
    const messages = (typeof entree === "string" ? [{ role: "user", content: entree }] : entree).map((m) => ({ role: m.role, content: m.content }));
    const outils = Array.isArray(o.tools) ? o.tools.slice(0, 16) : [];
    const defs = outils.map((t) => ({ name: t.name, description: t.description || "", input_schema: t.inputSchema || { type: "object", properties: {} } }));
    const rapide = o.modelTier === "quick";
    let final = "", tout = "";
    for (let tour = 0; tour < 10; tour += 1) {
      let r;
      try { r = await tourIA(messages, defs, rapide, o.signal, (t) => { final = t; if (o.onText) o.onText({ text: t }); }); }
      catch (e) { if (e && !e.text && tout) e.text = tout; throw e; }
      if (!r.contenu.length) break;
      messages.push({ role: "assistant", content: r.contenu });
      if (r.arret !== "tool_use") return { text: r.texte || tout, truncated: r.arret === "max_tokens" };
      if (r.texte.trim()) tout = (tout ? tout + "\n\n" : "") + r.texte.trim();
      const resultats = [];
      for (const b of r.contenu.filter((x) => x.type === "tool_use")) {
        const t = outils.find((x) => x.name === b.name);
        try {
          if (!t) throw new Error("Outil inconnu : " + b.name);
          const v = await t.execute(b.input || {});
          resultats.push({ type: "tool_result", tool_use_id: b.id, content: JSON.stringify(v === undefined ? null : v).slice(0, 120000) });
        } catch (e) { resultats.push({ type: "tool_result", tool_use_id: b.id, is_error: true, content: String((e && e.message) || e) }); }
      }
      messages.push({ role: "user", content: resultats });
      final = "";
    }
    if (!(final || tout).trim()) throw echec("empty_completion", "R√©ponse vide");
    return { text: final || tout, truncated: false };
  }
  echantillon.json = async (consigne, o = {}) => {
    const r = await echantillon(String(consigne) + "\n\nR√©ponds uniquement avec un objet JSON valide, sans aucun texte autour.", { ...o, tools: undefined });
    const t = r.text.replace(/^\s*```(?:json)?/i, "").replace(/```\s*$/, "").trim();
    const a = t.indexOf("{"), z = t.lastIndexOf("}");
    try { return JSON.parse(a >= 0 && z > a ? t.slice(a, z + 1) : t); } catch (e) { throw echec("invalid_json", "R√©ponse illisible"); }
  };
  echantillon.limits = async () => ({ tools: { maxCount: 16 } });

  window.SDE = {
    moi: MOI, pret,
    connexion: (email, motDePasse) => appel("/api/connexion", { email, motDePasse }),
    inscription: (o) => appel("/api/inscription", o),
    activation: (o) => appel("/api/activation", o),
    motDePasse: (o) => appel("/api/mot-de-passe", o),
    priere: (o) => appel("/api/priere", o),
    monEspace: async () => { const r = await fetch("/api/mon-espace", { credentials: "same-origin", cache: "no-store" }); const j = await r.json().catch(() => ({})); if (!r.ok) throw echec(j.erreur || "unavailable", j.message); return j; },
    async deconnexion() { try { await appel("/api/deconnexion", {}); } catch (e) { /* d√©j√† d√©connect√© */ } location.reload(); },
    comptes: async () => { const r = await fetch("/api/comptes", { credentials: "same-origin" }); const j = await r.json(); if (!r.ok) throw echec(j.erreur, j.message); return j; },
    majCompte: (o) => appel("/api/comptes", o),
    importer: (docs) => appel("/api/import", { docs }),
    monHistorique: async () => { const r = await fetch("/api/mon-historique", { credentials: "same-origin", cache: "no-store" }); const j = await r.json().catch(() => ({})); if (!r.ok) throw echec(j.erreur || "unavailable", j.message); return j; },
    monProfil: (o) => appel("/api/mon-profil", o, "PATCH"),
    absence: (o) => appel("/api/absence", o),
    pushSub: (o) => appel("/api/push", o),
    pushUnsub: (o) => { return fetch("/api/push", { method: "DELETE", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify(o) }).then((r) => r.json()); },
  };
  window.claude = {
    use: async (nom) => {
      await pret;
      if (nom === "db") return db;
      if (nom === "user") return user;
      if (nom === "downloads") return downloads;
      if (nom === "assets") return MOI.niveau >= 2 ? assets : null;
      if (nom === "sample") return MOI.ia ? echantillon : null;
      return null;
    },
  };
})();
</script>

  const abos = [];

  function noteCache(cle, meta) { S.caches[cle] = !!(meta && meta.fromCache); }
  function erreurAbo(e) {

  function abonner() {

    }, erreurAbo));
    const suivre = (col, cle, tri) => {
      let q = db.collection(col);

    };

    else { S.pret.suivi = true; S.pret.speciales = true; S.pret.offrandes = true; }

    if (accesFinances()) suivre("projets_fin", "projetsFin", null); else S.pret.projetsFin = true;

    if (accesRegistre()) {
      abos.push(db.collection("membres").onSnapshot((q) => {

        S.discipline = q.docs.map((d) => ({ id: d.id, ...d.data() })); S.pret.discipline = true; noteCache("discipline", q.metadata); render();

  function abonnerMois(cle) {

      if (garder.has(k)) continue;
      try { un(); } catch (e) { /* d√©j√† ferm√© */ }
      subsMois.delete(k); delete S.ops[k]; delete S.opsPret[k]; delete S.caches["ops-" + k];

  /* √âcritures */
  function messageErreur(e) {

    if (code === "resource_exhausted") return "Trop d‚Äôenregistrements en peu de temps. Patientez quelques secondes puis r√©essayez.";
    if (code === "revoked") return "Votre acc√®s a chang√©. Rechargez la page.";

  }
  async function ecrire(fn, ok) {
    if (!S.db) { toast("Les donn√©es ne sont pas disponibles dans cette vue.", "err"); return false; }
    S.attente += 1; majSync();
    try {
      try { await fn(); }
      catch (e) {
        if (!e || e.code !== "unavailable") throw e;
        await sleep(400 + Math.random() * 700);
        await fn();
      }
      if (ok) toast(ok);
      return true;
    } catch (e) {
      toast(messageErreur(e), "err");
      if (e && e.code === "invalid_argument" && S.peutEcrire === null && !S.estAdmin) { S.peutEcrire = false; render(); }
      if (e && e.code === "revoked") { S.etat = "revoque"; render(); }
      return false;
    } finally { S.attente -= 1; majSync(); }
  }
  const files = new Map();
  function enFile(cle, fn) {
    const p = (files.get(cle) || Promise.resolve()).catch(() => {}).then(fn);

    p.finally(() => { if (files.get(cle) === p) files.delete(cle); }).catch(() => {});
    return p;
  }

  /* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê Interface g√©n√©rale ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
  function majSync() {
    const el = $("#sync"), t = $("#sync-t");
    if (!el) return;
    let cls = "", txt = "√Ä jour";
    const cache = Object.values(S.caches).some(Boolean);
    if (S.etat === "connexion") { cls = "wait"; txt = "Connexion‚Ä¶"; }
    else if (S.etat === "absent") { cls = "off"; txt = "Non connect√©"; }

    else if (!S.enLigne) { cls = "off"; txt = "Hors ligne"; }

    else if (cache) { cls = "wait"; txt = "Synchronisation‚Ä¶"; }
    el.className = "sync" + (cls ? " " + cls : "");
    el.title = txt;

    el.textContent = msg;

    setTimeout(() => el.remove(), type === "err" ? 6500 : 3200);
  }

  function planifierEnvoi(pt) { clearTimeout(pt.timer); pt.timer = setTimeout(() => envoyerPointage(pt, false), 650); }
  /* Les appuis sont regroup√©s puis envoy√©s en une seule √©criture fusionn√©e : chaque membre est une cl√©
     distincte de ¬´ presents ¬ª, si bien que deux responsables qui pointent en m√™me temps ne s‚Äô√©crasent pas. */
  async function envoyerPointage(pt, final) {
    if (!pt || !pt.id || !S.db) return;
    clearTimeout(pt.timer);
    if (final) pt.final = true;
    if (pt.envoi) return;
    const lot = pt.attente, cpt = pt.compteurs;
    if (!Object.keys(lot).length && !Object.keys(cpt).length) return;
    pt.attente = {}; pt.compteurs = {};
    pt.vol = { ...pt.vol, ...lot }; pt.volC = { ...pt.volC, ...cpt };
    pt.envoi = true;
    const payload = { ...tampon(), ...cpt };
    if (Object.keys(lot).length) payload.presents = lot;
    const id = pt.id;
    const ok = await enFile("evt:" + id, () => ecrire(() => S.db.doc("evenements/" + id).update(payload)));
    pt.envoi = false;
    for (const k of Object.keys(lot)) if (!(k in pt.attente)) delete pt.vol[k];
    for (const k of Object.keys(cpt)) if (!(k in pt.compteurs)) delete pt.volC[k];
    if (!ok) toast("Le dernier pointage n‚Äôa pas √©t√© enregistr√©.", "err");
    if (Object.keys(pt.attente).length || Object.keys(pt.compteurs).length) { if (pt.final) envoyerPointage(pt, true); else planifierEnvoi(pt); }

  }

  /* Signaux tir√©s du pointage : absences non justifi√©es d‚Äôaffil√©e, retards r√©p√©t√©s. Ce ne sont pas des sanctions. */
  function vigilances() {
    const pts = evenementsPointes();
    const deb = debutPeriode("3m");
    const out = [];
    for (const m of membresActifs()) {
      const evs = pts.filter((e) => compte(e, m));
      let serie = 0;
      for (const e of evs) { const v = presentsEffectifs(e)[m.id]; if (estPresent(v) || v === "excuse") break; serie += 1; }
      const retards = evs.filter((e) => e.date >= deb && presentsEffectifs(e)[m.id] === "retard").length;
      const raisons = [];
      if (serie >= 3) raisons.push({ motif: MOTIFS_DISC[0], texte: `${serie} absences non justifi√©es d‚Äôaffil√©e` });
      if (retards >= 3) raisons.push({ motif: MOTIFS_DISC[1], texte: `${retards} retards en trois mois` });
      if (raisons.length) out.push({ m, raisons });
    }
    return out;
  }
  function graphePresence(evts, petit) {
    const max = Math.max(1, ...evts.map(totalPresence));
    const resume = evts.map((e) => `${fmtCourt(e.date)} : ${totalPresence(e)} personnes`).join(" ; ");
    return `<div class="evchart${petit ? " sm" : ""}" role="img" aria-label="${esc(resume)}" style="grid-template-columns:repeat(${evts.length},minmax(0,1fr))">${evts.map((e) => {
      const mb = nbPresents(e), ext = compteur(e, "visiteurs") + compteur(e, "nouveaux");
      return `<div class="ev-col" title="${esc(`${e.titre} ¬∑ ${fmtCourt(e.date)} : ${mb} membres, ${ext} visiteurs et nouveaux venus`)}"><b>${nb(mb + ext)}</b><div class="ev-bars"><i class="ext" style="height:${((ext / max) * 100).toFixed(1)}%"></i><i class="mb" style="height:${((mb / max) * 100).toFixed(1)}%"></i></div><span>${esc(fmtCourt(e.date))}</span></div>`;
    }).join("")}</div><div class="legend"><span><i class="mb"></i>Membres</span><span><i class="ext"></i>Visiteurs et nouveaux venus</span></div>`;
  }
  function rowAssiduite(m, s) {
    const nv = niveauAssiduite(s.taux);
    const compte = s.n - s.x;
    const detail = s.n ? `${s.p + s.r} pr√©sence${s.p + s.r > 1 ? "s" : ""} sur ${compte}${s.r ? ` ¬∑ ${pluriel(s.r, "retard", "retards")}` : ""}${s.x ? ` ¬∑ ${pluriel(s.x, "absence excus√©e", "absences excus√©es")}` : ""}` : "Aucun rassemblement point√© depuis son arriv√©e";
    return `<button class="row" type="button" data-act="voir-membre" data-id="${esc(m.id)}">${avatar(m)}<span class="row-main"><span class="row-t">${esc(nomComplet(m))}</span><span class="row-m">${esc(detail)}</span>${s.taux != null ? `<span class="bar slim ${nv.cls}" aria-hidden="true"><i style="width:${(s.taux * 100).toFixed(1)}%"></i></span>` : ""}</span><span class="row-r"><b class="taux">${pct(s.taux)}</b><span class="chip ${nv.cls}">${nv.lib}</span></span></button>`;
  }
  function vueAssiduite() {

    if (!evts.length) return out + vide("i-ucheck", `Aucun rassemblement point√© sur ${esc(libPeriode(f.periode))}. Ouvrez un rassemblement de l‚Äôagenda et pointez les pr√©sences : l‚Äôassiduit√© de chaque membre se calcule ensuite toute seule.`, btn("sous", "Voir les rassemblements pass√©s", { ico: "i-cal", sm: true, data: 'data-vue-cible="agenda" data-sous="passes"' }));

    out += `<h2 class="h3" style="margin-top:22px">Assiduit√© par membre</h2><p class="hint" style="margin:0 0 8px">Du moins assidu au plus assidu. Les absences excus√©es ne comptent pas contre le membre.</p><div class="list">${tri.map((x) => rowAssiduite(x.m, x.s)).join("")}</div>`;
    const cols = evts.slice(0, 10).reverse();
    out += `<h2 class="h3" style="margin-top:22px">Feuille de pr√©sence</h2><p class="hint" style="margin:0 0 8px">${pluriel(cols.length, "dernier rassemblement point√©", "derniers rassemblements point√©s")}. P pr√©sent ¬∑ R retard ¬∑ E excus√© ¬∑ point : absent ¬∑ tiret : non concern√© (pas encore membre, ou r√©union d‚Äôune autre garnison).</p>
      <div class="table-wrap"><table class="t feuille"><thead><tr><th scope="col">Membre</th>${cols.map((e) => `<th scope="col" title="${esc(e.titre)}">${esc(fmtCourt(e.date))}</th>`).join("")}<th scope="col">Taux</th></tr></thead><tbody>${tri.map(({ m, s }) => `<tr><th scope="row">${esc(nomComplet(m))}</th>${cols.map((e) => {
        if (!compte(e, m)) return `<td class="na">‚Äì</td>`;
        const v = presentsEffectifs(e)[m.id];
        return v === true ? `<td class="p">P</td>` : v === "retard" ? `<td class="r">R</td>` : v === "excuse" ? `<td class="e">E</td>` : `<td class="a">¬∑</td>`;
      }).join("")}<td class="num">${pct(s.taux)}</td></tr>`).join("")}</tbody></table></div>`;
    return out;
  }
  function carteAssiduite() {
    const pied = `<button class="link" type="button" data-act="aller-assiduite">Ouvrir l‚Äôassiduit√©</button>`;
    if (!S.pret.membres || !S.pret.evenements) return carte("Assiduit√©", chargement("Analyse des pr√©sences‚Ä¶"));
    const evts = evtsPeriode("3m", "");
    if (!evts.length) return carte("Assiduit√©", `<p class="hint">Aucun rassemblement point√© depuis trois mois. Le taux d‚Äôassiduit√© appara√Ætra apr√®s le premier pointage.</p>`, { pied });
    const stats = membresActifs().map((m) => statsMembre(m, evts)).filter((s) => s.taux != null);

    const corps = `<p class="big-figure num">${pct(moyen)}<small>de taux moyen</small></p><p class="hint">Sur ${pluriel(evts.length, "rassemblement point√©", "rassemblements point√©s")} depuis trois mois.</p>${graphePresence(evts.slice(0, 8).reverse(), true)}${vig ? `<p class="note warn" style="margin-bottom:0">${pluriel(vig, "point de vigilance", "points de vigilance")} : absences ou retards r√©p√©t√©s. <button class="link" type="button" data-act="aller-discipline">Voir</button></p>` : ""}`;

    const dots = pts.slice(0, 12).reverse().map((e) => {

      <p class="hint">${s3.n ? `${pluriel(s3.p + s3.r, "pr√©sence", "pr√©sences")} sur ${pluriel(s3.n - s3.x, "rassemblement compt√©", "rassemblements compt√©s")}${s3.r ? `, dont ${pluriel(s3.r, "retard", "retards")}` : ""}${s3.x ? ` ¬∑ ${pluriel(s3.x, "absence excus√©e", "absences excus√©es")}` : ""}.` : "Aucun rassemblement point√© depuis trois mois."}</p>
      <div class="dots" role="img" aria-label="${esc(`${Math.min(12, pts.length)} derniers rassemblements point√©s`)}">${dots}</div>

  function exporterAssiduite() {

    const rows = [["Matricule", "Nom", "Pr√©noms", ...evts.map((e) => `${e.date.split("-").reverse().join("/")} ${e.titre || ""}`.trim()), "Pr√©sences", "Retards", "Excus√©s", "Absences", "Taux"]];
    membresActifs().forEach((m) => {
      const s = statsMembre(m, evts);

  /* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê Cotisations ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
  const cleCotis = (mid, annee) => `${mid}-${annee}`;
  const ledger = (mid, annee) => S.cotisations[cleCotis(mid, annee)] || null;
  function moisPayes(mid, annee) {
    const l = ledger(mid, annee);
    const o = {};
    if (l && l.mois) for (const [k, v] of Object.entries(l.mois)) if (v && typeof v === "object") o[k] = v;
    return o;
  }
  function moisDus(m, annee) {
    if (m.cotisationExempte) return [];
    const c = cfg();
    if (!Number(c.cotisationMensuelle) && !c.cotisationDebut) return [];
    let debut = `${annee}-01`;
    if (c.cotisationDebut && c.cotisationDebut > debut) debut = c.cotisationDebut;
    if (m.adhesion && m.adhesion.slice(0, 7) > debut) debut = m.adhesion.slice(0, 7);
    const fin = `${annee}-12` < moisCourant() ? `${annee}-12` : moisCourant();
    const out = [];
    for (let k = 1; k <= 12; k += 1) { const cle = `${annee}-${pad(k)}`; if (cle >= debut && cle <= fin) out.push(pad(k)); }
    return out;
  }
  function etatCotis(m, annee) {
    const payes = moisPayes(m.id, annee);
    const dus = moisDus(m, annee);
    return { payes, dus, retard: dus.filter((k) => !payes[k]), verse: Object.values(payes).reduce((t, v) => t + (Number(v.montant) || 0), 0), exempt: !!m.cotisationExempte };
  }
  const libMois = (k) => MOIS_NOMS[Number(k) - 1] || "";
  function libListeMois(ks, annee) {
    const s = (ks || []).slice().sort();
    if (!s.length) return "";
    if (s.length === 1) return `${libMois(s[0])} ${annee}`;
    const suite = s.every((k, i) => i === 0 || Number(k) === Number(s[i - 1]) + 1);
    if (suite && s.length > 2) return `${libMois(s[0])} √† ${libMois(s[s.length - 1])} ${annee}`;
    return `${s.slice(0, -1).map(libMois).join(", ")} et ${libMois(s[s.length - 1])} ${annee}`;
  }
  function cellulesCotis(e, annee, grand) {
    return `<span class="cot-mois${grand ? " lg" : ""}" aria-hidden="true">${MOIS_INI.map((l, i) => {
      const k = pad(i + 1);
      const cls = e.payes[k] ? "ok" : e.exempt ? "ex" : e.dus.includes(k) ? "du" : `${annee}-${k}` > moisCourant() ? "fut" : "na";
      return `<i class="${cls}">${l}</i>`;
    }).join("")}</span>`;
  }
  const chipCotis = (e) => (e.exempt ? `<span class="chip">Exemption</span>` : e.retard.length ? `<span class="chip danger">${e.retard.length} mois ${e.retard.length > 1 ? "dus" : "d√ª"}</span>` : e.dus.length ? `<span class="chip ok">√Ä jour</span>` : `<span class="chip">Rien de d√ª</span>`);
  function rowCotis(m, annee) {
    const e = etatCotis(m, annee);
    return `<button class="row nolead" type="button" data-act="voir-cotis" data-id="${esc(m.id)}"><span class="row-main"><span class="row-t">${esc(nomComplet(m))}</span>${cellulesCotis(e, annee)}<span class="sr">${esc(`${Object.keys(e.payes).length} mois r√©gl√©s, ${e.retard.length} en retard`)}</span></span><span class="row-r">${chipCotis(e)}<span class="amt">${nb(e.verse)}</span></span></button>`;
  }
  function vueCotisations() {
    const c = cfg();
    const an = S.annee;
    const adm = peutAdmin();
    const curY = new Date().getFullYear();
    let out = `<div class="toolbar"><div class="mnav"><button class="icon-btn" type="button" data-act="annee-prec" aria-label="Ann√©e pr√©c√©dente">${I("i-left")}</button><span class="mnav-l" aria-live="polite">Ann√©e ${an}</span><button class="icon-btn" type="button" data-act="annee-suiv" aria-label="Ann√©e suivante"${an >= curY + 1 ? " disabled" : ""}>${I("i-right")}</button></div><div class="btn-row">${adm ? btn("ajout-cotis", "Enregistrer une cotisation", { ico: "i-plus", cls: "btn-primary" }) : ""}${btn("export-cotis", `<span class="hide-s">Exporter</span>`, { ico: "i-down", cls: "btn-ghost ico-s", attrs: 'aria-label="Exporter les cotisations en CSV"' })}</div></div>`;
    if (!S.pret.cotisations || !S.pret.membres) return out + chargement("Lecture des cotisations‚Ä¶");
    const mens = Number(c.cotisationMensuelle) || 0;
    out += mens
      ? `<p class="hint" style="margin:0 0 12px">Cotisation mensuelle : <b>${esc(fcfa(mens))}</b>${c.cotisationDebut ? `, due depuis ${esc(fmtMois(c.cotisationDebut))}` : ""}.</p>`
      : `<p class="note warn">Le montant de la cotisation mensuelle n‚Äôest pas encore d√©fini : aucun mois n‚Äôest compt√© comme d√ª, mais les versements peuvent d√©j√† √™tre enregistr√©s. ${adm ? `<button class="link" type="button" data-act="reglages">D√©finir le montant</button>` : "Un √©diteur peut le d√©finir dans les r√©glages."}</p>`;
    const actifs = membresActifs();
    const etats = actifs.map((m) => ({ m, e: etatCotis(m, an) }));
    const verse = etats.reduce((t, x) => t + x.e.verse, 0);
    const aJour = etats.filter((x) => !x.e.exempt && x.e.dus.length && !x.e.retard.length).length;
    const enRet = etats.filter((x) => x.e.retard.length).length;
    const dusTot = etats.reduce((t, x) => t + x.e.dus.length, 0);
    const regles = etats.reduce((t, x) => t + x.e.dus.filter((k) => x.e.payes[k]).length, 0);
    const reste = mens ? etats.reduce((t, x) => t + x.e.retard.length, 0) * mens : null;
    out += `<div class="stats s4">
      <div class="stat in"><span class="stat-l">${I("i-in")}Collect√© en ${an}</span><span class="stat-v">${nb(verse)}<small>FCFA</small></span><span class="stat-m">${pluriel(etats.reduce((t, x) => t + Object.keys(x.e.payes).length, 0), "mois r√©gl√©", "mois r√©gl√©s")}</span></div>
      <div class="stat"><span class="stat-l">√Ä jour</span><span class="stat-v">${nb(aJour)}</span><span class="stat-m">sur ${pluriel(actifs.length, "membre actif", "membres actifs")}</span></div>
      <div class="stat out"><span class="stat-l">En retard</span><span class="stat-v">${nb(enRet)}</span><span class="stat-m">${reste != null ? `${esc(fcfa(reste))} √† recouvrer` : "Montant non d√©fini"}</span></div>
      <div class="stat"><span class="stat-l">Recouvrement</span><span class="stat-v">${pct(dusTot ? regles / dusTot : null)}</span><span class="stat-m">Des mois dus, r√©gl√©s</span></div></div>`;
    const f = S.f.cotis;
    out += `<div class="filters"><div class="chips" role="group" aria-label="Filtrer les membres">${[["tous", "Tous"], ["retard", "En retard"], ["ajour", "√Ä jour"]].map(([id, l]) => `<button class="chip-btn${f.filtre === id ? " on" : ""}" type="button" data-act="cotis-filtre" data-v="${id}" aria-pressed="${f.filtre === id}">${l}</button>`).join("")}</div><label class="sr" for="q-cotis">Rechercher un membre</label><input class="search" id="q-cotis" type="search" placeholder="Nom ou matricule‚Ä¶" value="${esc(f.q)}" data-filtre="cotis.q" autocomplete="off"></div>
      <div class="legend" style="margin:-4px 0 10px"><span><i class="c-ok"></i>R√©gl√©</span><span><i class="c-du"></i>D√ª</span><span><i class="c-fut"></i>√Ä venir</span><span><i class="c-na"></i>Non d√ª</span></div>`;
    if (!actifs.length) return out + vide("i-users", "Aucun membre actif dans le registre.");
    const q = norm(f.q);
    const liste = etats.filter((x) => (f.filtre === "retard" ? x.e.retard.length : f.filtre === "ajour" ? !x.e.retard.length && !x.e.exempt && x.e.dus.length : true) && (!q || norm(nomComplet(x.m) + " " + (x.m.matricule || "")).includes(q)))
      .sort((a, b) => b.e.retard.length - a.e.retard.length || parNom(a.m, b.m));
    if (!liste.length) return out + vide("i-search", "Aucun membre ne correspond.");
    return out + `<div class="list">${liste.map((x) => rowCotis(x.m, an)).join("")}</div>`;
  }
  function ficheCotis(mid) {
    const m = membre(mid);
    if (!m) return null;
    const an = S.annee;
    const e = etatCotis(m, an);
    const mens = Number(cfg().cotisationMensuelle) || 0;
    const lignes = Object.entries(e.payes).sort((a, b) => cmpFr(a[0], b[0])).map(([k, v]) => `<div class="kv-l"><span>${esc(cap(libMois(k)))} ${an}</span><span class="num">${esc(fcfa(v.montant))} ¬∑ vers√© le ${esc(fmtCourt(v.date))}</span></div>`).join("");
    return `<div class="ident">${avatar(m, true)}<div><h3>${esc(nomUsuel(m))}</h3><p>${esc([m.matricule, m.fonction].filter(Boolean).join(" ¬∑ "))}</p></div></div>
      <div class="figure">${chipCotis(e)}${e.retard.length ? `<span>${esc(cap(libListeMois(e.retard, an)))}</span>` : ""}</div>

  async function televerserPhoto(input) {

    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
