# MPA SDE — configuration Cloudflare
name = "sde"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[routes]]
pattern = "app.mouvement-sde.org"
custom_domain = true

[[routes]]
pattern = "mouvement-sde.org"
custom_domain = true

[[routes]]
pattern = "www.mouvement-sde.org"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "sde-digital"
database_id = "58ab0ca0-d8c6-4f2a-acc4-2761814c058b"

[[kv_namespaces]]
binding = "FICHIERS"
id = "d6c94ba3274f47718a4cacbcab96e5a3"

# Médiathèque : pour passer à 10 Go gratuits, activer R2 dans Cloudflare, créer le compartiment
# « sde-medias », puis retirer les # des trois lignes suivantes. Les fichiers déjà envoyés restent lisibles.
# [[r2_buckets]]
# binding = "MEDIAS"
# bucket_name = "sde-medias"

[vars]
# Adresses e-mail propriétaires (tous les droits ; elles ne peuvent servir à une inscription libre)
PROPRIETAIRES = "infosoldat@gmail.com, projeremyelu@gmail.com"
# À activer APRÈS vérification de l'adresse Gmail et du domaine expéditeur Cloudflare :
# NOTIFICATION_FROM = "notifications@mouvement-sde.org"
# Voir docs/notifications-email-sde.md
#
# [[send_email]]
# name = "EMAIL"
# destination_address = "infosoldat@gmail.com"


[observability]
enabled = true

# Sauvegarde automatique de toute la base, chaque nuit à 2 h (heure d'Abidjan), gardée 35 jours
[triggers]
crons = ["0 2 * * *", "*/15 * * * *"]
